<title>七上段考複習卡</title>
<style>
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#1D2330; --soft:#5B6475; --line:#DFE3EA;
  --accent:#2F6FDB; --accent-soft:#E6EEFB; --warn:#B45309; --warn-soft:#FDF1E1;
  --ok:#15803D; --mask:#E9ECF1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151C; --card:#1A202A; --ink:#E7EAF0; --soft:#9AA3B3; --line:#2B3340;
    --accent:#7FA8F0; --accent-soft:#1F2C44; --warn:#F2B36B; --warn-soft:#3A2A16;
    --ok:#6FD39A; --mask:#2A313D;
  }
}
:root[data-theme="dark"]{
  --bg:#11151C; --card:#1A202A; --ink:#E7EAF0; --soft:#9AA3B3; --line:#2B3340;
  --accent:#7FA8F0; --accent-soft:#1F2C44; --warn:#F2B36B; --warn-soft:#3A2A16;
  --ok:#6FD39A; --mask:#2A313D;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6;font-size:16px}
header{padding:20px 16px 8px;max-width:860px;margin:0 auto}
header h1{font-size:1.35rem;font-weight:800;letter-spacing:.03em}
header p{color:var(--soft);font-size:.88rem;margin-top:4px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{max-width:860px;margin:0 auto;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;font:inherit;font-size:.86rem;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--soft);cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{max-width:860px;margin:0 auto;padding:6px 16px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--soft)}
.bar button{font:inherit;font-size:.82rem;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
main{max-width:860px;margin:0 auto;padding:6px 16px 60px}
section{display:none}
section.on{display:block}
h2{font-size:1.05rem;margin:18px 0 8px;font-weight:800}
h2 small{font-weight:500;color:var(--soft);font-size:.8rem;margin-left:6px}
.tip{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.88rem;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;-webkit-tap-highlight-color:transparent}
.item .q{font-size:.95rem}
.item .q .no{color:var(--soft);font-size:.78rem;font-variant-numeric:tabular-nums}
.item .a{font-weight:800;color:var(--accent);font-size:1.02rem;border-radius:6px;transition:background .15s,color .15s}
.item .why{font-size:.83rem;color:var(--soft)}
.masked .item:not(.open) .a,.masked .item:not(.open) .why{color:transparent;background:var(--mask);user-select:none}
.masked .item:not(.open) .a::after{content:"點一下看答案";color:var(--soft);font-weight:500;font-size:.78rem;padding:0 8px}
.masked .item:not(.open) .a{position:relative}
.masked .item:not(.open) .a > *{display:none}
.item.wide{grid-column:1/-1}
.flag{display:inline-block;font-size:.72rem;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.hl{color:var(--warn);font-weight:800}
.mark{margin-left:auto;font-size:.75rem;color:var(--soft)}
.item.known{border-color:var(--ok)}
.item.known .q .no::after{content:"✓ ";color:var(--ok);font-weight:800}
footer{max-width:860px;margin:0 auto;padding:0 16px 40px;color:var(--soft);font-size:.78rem}
</style>
</head>

<header>
  <h1>七上第一次段考 考前複習卡</h1>
  <p>英文＋國文。題目照老師發的複習卷，答案先遮住，自己先想，再點一下看答案。標「待核對」的是卷子印不清楚或答案有爭議，考前跟老師的答案對一下。</p>
</header>

  </div>
</nav>
<main id="main"></main>

var KEY = "exam_g7_mid1_known_v1";
var known = {};
try { known = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { known = {}; }
function saveKnown(){ try { localStorage.setItem(KEY, JSON.stringify(known)); } catch(e) {} }

var tabs = document.getElementById("tabs"), main = document.getElementById("main");
var total = 0;

DATA.forEach(function(sec, si){
  var b = document.createElement("button");
  b.type = "button"; b.textContent = sec.name; b.setAttribute("data-id", sec.id);
  b.addEventListener("click", function(){ show(sec.id); });
  tabs.appendChild(b);

  var s = document.createElement("section");
  s.id = "sec-" + sec.id; s.className = "masked";
  sec.blocks.forEach(function(bl, bi){
    var h = document.createElement("h2");
    h.textContent = bl.t;
    if (bl.n) { var sm = document.createElement("small"); sm.textContent = bl.n; h.appendChild(sm); }
    s.appendChild(h);
    if (bl.tip) { var tp = document.createElement("div"); tp.className = "tip"; tp.textContent = bl.tip; s.appendChild(tp); }
    var g = document.createElement("div"); g.className = "grid";
    var items = typeof bl.items === "string" ? LISTS[bl.items] : bl.items;
    items.forEach(function(it, ii){
      var id = sec.id + "-" + bi + "-" + ii;
      var d = document.createElement("div");
      d.className = "item" + (bl.wide ? " wide" : "") + (known[id] ? " known" : "");
      var q = document.createElement("div"); q.className = "q";
      var no = document.createElement("span"); no.className = "no"; q.appendChild(no);
      q.appendChild(document.createTextNode(it[0]));
      if (it[3]) { var f = document.createElement("span"); f.className = "flag"; f.textContent = "待核對"; q.appendChild(f); }
      var a = document.createElement("div"); a.className = "a";
      var inner = document.createElement("span"); inner.innerHTML = it[1]; a.appendChild(inner);
      d.appendChild(q); d.appendChild(a);
      if (it[2]) { var w = document.createElement("div"); w.className = "why"; w.textContent = it[2]; d.appendChild(w); }
      d.addEventListener("click", function(){ d.classList.toggle("open"); });
      d.addEventListener("dblclick", function(){
        if (known[id]) { delete known[id]; d.classList.remove("known"); }
        else { known[id] = 1; d.classList.add("known"); }
        saveKnown(); stat();
      });
      g.appendChild(d); total++;
    });
    s.appendChild(g);
  });
  main.appendChild(s);
});

var current = DATA[0].id;
function show(id){
  current = id;
  Array.prototype.forEach.call(tabs.children, function(b){ b.className = b.getAttribute("data-id") === id ? "on" : ""; });
  Array.prototype.forEach.call(main.children, function(s){ s.classList.toggle("on", s.id === "sec-" + id); });
  syncToggle();
  try { localStorage.setItem("exam_g7_mid1_tab", id); } catch(e) {}
  window.scrollTo(0,0);
}
var tg = document.getElementById("toggleMask");
function syncToggle(){
  var s = document.getElementById("sec-" + current);
  tg.textContent = s.classList.contains("masked") ? "全部顯示答案" : "全部遮住答案";
}
tg.addEventListener("click", function(){
  var s = document.getElementById("sec-" + current);
  s.classList.toggle("masked");
  Array.prototype.forEach.call(s.querySelectorAll(".item.open"), function(d){ d.classList.remove("open"); });
  syncToggle();
});
document.getElementById("resetKnown").addEventListener("click", function(){
  known = {}; saveKnown();
  Array.prototype.forEach.call(document.querySelectorAll(".item.known"), function(d){ d.classList.remove("known"); });
  stat();
});
function stat(){
  document.getElementById("stat").textContent = "我會了 " + Object.keys(known).length + "／" + total;
}
var start = DATA[0].id;

show(start); stat();
