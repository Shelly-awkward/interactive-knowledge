<script>
/* ==== REGION:ENGINE ==== 擁有者：T1（狀態機、回合流程、畫面切換、HUD、序章、步驟畫面、CG.debug.autoplay） */
(function () {
  'use strict';
  const D = GAME_DATA;
  const C = CG.core;
  const esc = (s) => CG.ui.esc(s);
  const tag = (src) => CG.ui.srcTag(src);
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const uniq = (a) => Array.from(new Set(a));
  const RISK_IDS = D.risks.map((r) => r.id);
  const FAMILY_IDS = D.dataFamilies.map((f) => f.id);
  const SCEN_IDS = D.scenarios.map((s) => s.id);
  const KRI_IDS = D.erm.kris.map((k) => k.id);
  const LAST_TURN = D.turns.length - 1;

  /* ---------- 狀態 ---------- */
  function initState() {
    return { screen: 'title', prologue: { pick: null, situation: null, round2: null },
      draft: { companyId: null, tileId: null }, game: null, feedback: [] };
  }
  let S = initState();
  let root = null;
  let local = {};          // 畫面上還沒送出的選擇
  let localKey = '';

  const fail = (msg) => { throw new Error(msg); };
  const need = (cond, msg) => { if (!cond) fail(msg); };

  function atStep(s, n) {
    need(s.screen === 'step' && s.game && s.game.stepIndex === n, '現在不是第 ' + (n + 1) + ' 步');
  }
  /* 第 5、6 步要看哪幾條路線：第 3 步選到的那幾邊；不需要查參數時兩邊都看 */
  function routesToAnswer(game, t) {
    const tr = game.turns[t];
    const c3 = C.check.step3(tr.scenarios, tr.families);
    if (c3.reason === 'notNeeded') return C.ROUTE_IDS.slice();
    return C.ROUTE_IDS.filter((r) => c3.coverage[r]);
  }
  function truthsFor(game, t, routes) {
    const out = {};
    routes.forEach((r) => { const a = C.assess(game, r, t, []); out[r] = { q1: a.q1, q2: a.q2 }; });
    return out;
  }
  function feedbackOf(n, check, game) {
    return (CG.ui.feedbackLines(n, check, game) || []).map((x) => ({ text: String(x.text), src: x.src || null }));
  }

  function reduce(s, type, p) {
    const g = s.game;
    const t = g ? g.turnIndex : 0;
    const tr = g ? g.turns[t] : null;
    switch (type) {
      case 'title/start':
        need(s.screen === 'title', '只能在首頁開始');
        s.prologue = { pick: null, situation: null, round2: null };
        s.screen = 'prologue';
        return;
      case 'prologue/skip':
        need(s.screen === 'title' || s.screen === 'prologue', '現在不能跳過序章');
        s.screen = 'company';
        return;
      case 'prologue/pick': {
        need(s.screen === 'prologue', '不在序章');
        need(D.prologue.agents.some((a) => a.id === p.agentId), '沒有這位代購');
        const sits = D.prologue.situations;
        let sid = p.situationId;
        if (sid == null) sid = sits[Math.floor((p.rng || Math.random)() * sits.length)].id;
        need(sits.some((x) => x.id === sid), '沒有這種狀況');
        s.prologue = { pick: p.agentId, situation: sid, round2: null };
        return;
      }
      case 'prologue/round2':
        need(s.screen === 'prologue' && s.prologue.pick, '要先選代購');
        need(p.option === 0 || p.option === 1, '選項只有 0 或 1');
        s.prologue.round2 = p.option;
        return;
      case 'prologue/done':
        need(s.screen === 'prologue' && s.prologue.round2 != null, '要先回答第二輪');
        s.screen = 'company';
        return;
      case 'company/pick':
        need(s.screen === 'company', '不在選公司畫面');
        need(C.company(p.companyId), '沒有這家公司');
        s.draft = { companyId: p.companyId, tileId: null };
        s.screen = 'site';
        return;
      case 'site/pick':
        need(s.screen === 'site', '不在選據點畫面');
        need(C.tile(p.tileId), '沒有這一格');
        s.draft.tileId = p.tileId;
        return;
      case 'site/back':
        need(s.screen === 'site', '不在選據點畫面');
        s.screen = 'company';
        return;
      case 'game/start':
        need(s.screen === 'site', '不在選據點畫面');
        need(s.draft.companyId && s.draft.tileId, '還沒選據點');
        if (p.routeId != null) need(C.route(p.routeId), '沒有這條路線');
        s.game = C.newGame({ companyId: s.draft.companyId, tileId: s.draft.tileId, routeId: p.routeId || null, rng: p.rng });
        s.feedback = [];
        s.screen = 'turnIntro';
        return;
      case 'turn/begin':
        need(s.screen === 'turnIntro', '不在回合開場');
        s.screen = 'step';
        g.stepIndex = 0;
        s.feedback = [];
        return;
      case 'step1': {
        atStep(s, 0);
        const risks = p.risks;
        need(Array.isArray(risks) && risks.length > 0, '至少要選一項');
        need(risks.every((id) => id === 'none' || RISK_IDS.includes(id)), '有不存在的風險');
        need(!(risks.includes('none') && risks.length > 1), '「都不相關」不能跟其他風險一起選');
        tr.risks = uniq(risks);
        tr.checks.step1 = C.check.step1(g.companyId, g.tileId, tr.risks);
        s.feedback = feedbackOf(1, tr.checks.step1, g);
        g.stepIndex = 1;
        return;
      }
      case 'step2': {
        atStep(s, 1);
        const fams = p.families;
        need(Array.isArray(fams) && fams.length > 0, '至少要選一類');
        need(fams.every((id) => FAMILY_IDS.includes(id)), '有不存在的資料類別');
        need(!(fams.includes('none') && fams.length > 1), '「查無相關主題」不能跟其他資料一起選');
        tr.families = uniq(fams);
        tr.checks.step2 = C.check.step2(g.companyId, g.tileId, tr.families);
        tr.apPenalty = tr.checks.step2.apPenalty;
        s.feedback = feedbackOf(2, tr.checks.step2, g);
        g.stepIndex = 2;
        return;
      }
      case 'step3': {
        atStep(s, 2);
        const sc = p.scenarios || [];
        need(Array.isArray(sc) && sc.every((id) => SCEN_IDS.includes(id)), '有不存在的情境');
        const c = C.check.step3(uniq(sc), tr.families);
        if (c.reason !== 'notNeeded') need(uniq(sc).length >= 1 && uniq(sc).length <= 3, '情境要選 1 到 3 個');
        tr.scenarios = uniq(sc);
        tr.checks.step3 = c;
        s.feedback = feedbackOf(3, c, g);
        g.stepIndex = 3;
        return;
      }
      case 'step4': {
        atStep(s, 3);
        const dep = D.rules.depths[p.depth];
        need(dep, '沒有這種分析深度');
        const ap = C.apAvailable(g, t);
        need(dep.cost <= ap, '分析點不夠：「' + dep.name + '」要 ' + dep.cost + ' 點，本回合只有 ' + ap + ' 點');
        const c = C.check.step4(g.companyId, p.depth, ap);
        tr.depth = p.depth;
        tr.overCost = c.overCost;
        tr.checks.step4 = c;
        g.budget = C.round(Math.max(0, g.budget - c.overCost), 2);
        g.spent = C.round(g.spent + c.overCost, 2);
        s.feedback = feedbackOf(4, c, g);
        g.stepIndex = 4;
        return;
      }
      case 'step5': {
        atStep(s, 4);
        const routes = routesToAnswer(g, t);
        const preds = p.predictions || {};
        routes.forEach((r) => need(preds[r] && typeof preds[r].q1 === 'boolean' && typeof preds[r].q2 === 'boolean',
          '要回答「' + D.routes[r].name + '」的兩個問題'));
        tr.predictions = {};
        routes.forEach((r) => { tr.predictions[r] = { q1: preds[r].q1, q2: preds[r].q2 }; });
        tr.truths = truthsFor(g, t, routes);
        tr.checks.step5 = C.check.step5(tr.predictions, tr.truths);
        s.feedback = feedbackOf(5, tr.checks.step5, g);
        g.stepIndex = 5;
        return;
      }
      case 'step6': {
        atStep(s, 5);
        const bought = uniq(p.bought || []);
        const avail = C.measuresFor(g.companyId).map((m) => m.id);
        const prior = g.turns.slice(0, t).flatMap((x) => x.bought || []);
        bought.forEach((id) => {
          need(avail.includes(id), '這家公司不能買「' + id + '」');
          need(!prior.includes(id), '「' + C.measure(id).name + '」之前已經買過了');
        });
        const cost = C.round(bought.reduce((sum, id) => sum + C.measureCost(id, g.companyId), 0), 2);
        need(cost <= g.budget + 1e-9, '預算不夠：需要 ' + C.fmtYi(cost) + '，只剩 ' + C.fmtYi(g.budget));
        const erm = p.erm || {};
        const owner = erm.owner || null;
        need(owner === null || D.erm.owners.includes(owner), '沒有這個負責單位');
        const kris = uniq(erm.kris || []);
        need(kris.every((id) => KRI_IDS.includes(id)), '有不存在的監控指標');
        g.budget = C.round(g.budget - cost, 2);
        g.spent = C.round(g.spent + cost, 2);
        tr.bought = bought;
        tr.erm = { owner: owner, kris: kris };
        tr.checks.step6 = C.check.step6(g.companyId, g.tileId, tr.erm);
        tr.outcome = C.settleTurn(g);
        s.feedback = feedbackOf(6, tr.checks.step6, g);
        s.screen = 'settle';
        return;
      }
      case 'turn/next':
        need(s.screen === 'settle', '還沒結算');
        s.feedback = [];
        if (t < LAST_TURN) {
          g.turnIndex = t + 1;
          g.budget = C.round(g.budget + C.company(g.companyId).budget, 2);
          g.stepIndex = 0;
          s.screen = 'turnIntro';
        } else {
          s.screen = 'ending';
        }
        return;
      case 'replay':
        need(s.screen === 'ending', '還沒到結局');
        if (p.mode === 'otherRoute') {
          s.game = C.newGame({ companyId: g.companyId, tileId: g.tileId, routeId: C.otherRoute(g.routeId) });
          s.draft = { companyId: g.companyId, tileId: g.tileId };
          s.feedback = [];
          s.screen = 'turnIntro';
        } else if (p.mode === 'changeCompany') {
          s.game = null;
          s.draft = { companyId: null, tileId: null };
          s.feedback = [];
          s.screen = 'company';
        } else if (p.mode === 'restart') {
          Object.assign(s, initState());
        } else fail('沒有這種重玩方式');
        return;
      default:
        fail('不認得的動作：' + type);
    }
  }

  function act(type, payload) {
    const next = clone(S);
    reduce(next, type, payload || {});
    S = next;
    if (root) render();
    return clone(S);
  }

  /* ---------- 畫面 ---------- */
  function h(tagName, cls, html) {
    const el = document.createElement(tagName);
    if (cls) el.className = cls;
    if (html != null) el.innerHTML = html;
    return el;
  }
  function btn(label, cls, onClick, attrs) {
    const b = h('button', 'cg-btn' + (cls ? ' ' + cls : ''), label);
    b.type = 'button';
    Object.entries(attrs || {}).forEach(([k, v]) => b.setAttribute(k, v));
    b.addEventListener('click', onClick);
    return b;
  }
  function safeAct(type, payload) {
    try { act(type, payload); } catch (e) { showError(e.message); }
  }
  function showError(msg) {
    const box = root && root.querySelector('.cg-error');
    if (box) { box.textContent = msg; box.hidden = false; box.focus(); }
  }
  function errorBox() { const e = h('p', 'cg-error'); e.hidden = true; e.setAttribute('role', 'alert'); e.tabIndex = -1; return e; }
  function advisorSay(el, line) { CG.ui.renderAdvisor(el, line); }
  function feedbackBlock(el) { (S.feedback || []).forEach((line) => advisorSay(el, line)); }
  function terrainSummary(tileId) {
    const terr = C.terrainOf(tileId);
    const lv = (v) => (v >= 1.2 ? '高' : v >= 0.8 ? '中' : v >= 0.4 ? '低' : '');
    const parts = Object.entries(D.hazardBadges).map(([k, ch]) => (lv(terr.hazards[k]) ? ch + lv(terr.hazards[k]) : '')).filter(Boolean);
    return terr.name + (parts.length ? '（' + parts.join('、') + '）' : '');
  }
  function turnTitle(t) { const x = D.turns[t]; return x.label + '｜' + x.name + ' ' + x.years; }

  function hud() {
    const g = S.game;
    const co = C.company(g.companyId);
    const last = g.turns.slice().reverse().find((x) => x.outcome);
    const ap = S.screen === 'step' ? C.apAvailable(g, g.turnIndex) : null;
    const el = h('header', 'cg-hud');
    el.innerHTML =
      '<div class="cg-hud-row"><strong>' + esc(co.name) + '</strong><span>' + esc(turnTitle(g.turnIndex)) + '</span></div>' +
      '<div class="cg-hud-row cg-hud-stats">' +
      '<span>預算 <b>' + esc(C.fmtYi(g.budget)) + '</b></span>' +
      (ap != null ? '<span>分析點 <b>' + ap + '</b></span>' : '') +
      '<span>產能 <b>' + (last ? esc(C.fmtPct(last.outcome.capacity)) : '—') + '</b></span>' +
      '<span>年現金流 <b>' + (last ? esc(C.fmtYi(last.outcome.cf)) : '—') + '</b></span></div>';
    return el;
  }

  function render() {
    if (!root) return;
    const g = S.game;
    const key = S.screen + ':' + (g ? g.turnIndex + ':' + g.stepIndex : '') + ':' + (S.screen === 'prologue' ? S.prologue.pick + ':' + S.prologue.round2 : '');
    const sameScreen = key === localKey;
    if (!sameScreen) { local = {}; localKey = key; }
    const focusSel = sameScreen ? focusSelector(document.activeElement) : null;
    root.innerHTML = '';
    if (g && ['turnIntro', 'step', 'settle', 'ending'].includes(S.screen)) root.appendChild(hud());
    const wrap = h('main', 'cg-wrap');
    root.appendChild(wrap);
    SCREENS[S.screen](wrap);
    if (focusSel) {
      const el = root.querySelector(focusSel);
      if (el) el.focus();
    } else {
      window.scrollTo(0, 0);
      const head = wrap.querySelector('h1, h2');
      if (head) { head.tabIndex = -1; head.focus({ preventScroll: true }); }
    }
  }
  function focusSelector(el) {
    if (!el || !root || !root.contains(el)) return null;
    for (const a of ['data-tile', 'data-family', 'data-scen', 'data-key', 'data-id']) {
      if (el.hasAttribute(a)) return '[' + a + '="' + el.getAttribute(a) + '"]';
    }
    return null;
  }

  const SCREENS = {
    title(w) {
      w.appendChild(h('section', 'cg-hero',
        '<p class="cg-eyebrow">' + esc(D.meta.subtitle) + '</p><h1>' + esc(D.meta.title) + '</h1>' +
        '<p>' + esc(D.text.notPrediction) + '</p>'));
      const card = h('section', 'cg-card',
        '<h2>整局只問兩件事</h2><ol class="cg-q">' + D.text.twoQuestions.map((q) => '<li>' + esc(q) + '</li>').join('') + '</ol>' +
        '<p>你經營一家虛構公司，走過短期、中期、長期三個回合。每回合照懶人包的六步驟做一次情境分析，再快轉二十年看事件。</p>' +
        '<p class="cg-muted">先玩 1 分鐘的代購序章，再選公司。一局約 10 到 15 分鐘。</p>');
      const acts = h('div', 'cg-actions');
      acts.appendChild(btn('開始（從序章）', 'primary', () => safeAct('title/start')));
      acts.appendChild(btn('跳過序章', '', () => safeAct('prologue/skip')));
      card.appendChild(acts);
      card.appendChild(errorBox());
      w.appendChild(card);
      w.appendChild(h('p', 'cg-fine', esc(D.text.disclaimer) + ' ' + esc(D.text.fictional) + '<br>示範數字來源：' + esc(D.meta.source) + '。'));
    },

    prologue(w) {
      const P = D.prologue;
      const pr = S.prologue;
      const agent = (id) => P.agents.find((a) => a.id === id);
      w.appendChild(h('h1', 'cg-title', esc(P.title)));
      if (!pr.pick) {
        w.appendChild(h('p', 'cg-lead', esc(P.intro) + tag(P.src)));
        const list = h('div', 'cg-agents');
        P.agents.forEach((a) => {
          const b = btn('<span class="cg-agent-name">' + esc(a.name) + '</span><span class="cg-agent-plan">' + esc(a.plan) + '</span>' +
            '<span class="cg-agent-fee">代購費 ' + a.fee.toLocaleString() + ' 元・規劃費 ' + a.planFee.toLocaleString() + ' 元</span>',
            'cg-agent', () => safeAct('prologue/pick', { agentId: a.id }), { 'data-id': a.id });
          list.appendChild(b);
        });
        w.appendChild(list);
        w.appendChild(h('p', 'cg-muted', '金額都是' + tag('assumed') + '。'));
        w.appendChild(errorBox());
        return;
      }
      const sit = P.situations.find((x) => x.id === pr.situation);
      w.appendChild(h('p', 'cg-banner', '你把錢交給「' + esc(agent(pr.pick).name) + '」。實際狀況是：<strong>' + esc(sit.name) + '</strong>'));
      const grid = h('div', 'cg-sits');
      P.situations.forEach((x) => {
        const box = h('section', 'cg-sit' + (x.id === sit.id ? ' is-drawn' : ''));
        box.innerHTML = '<h2>' + esc(x.name) + (x.id === sit.id ? '<span class="cg-pill">這次抽到</span>' : '') + '</h2>' +
          '<ul>' + P.agents.map((a) => {
            const r = x.results[a.id];
            const verdict = !r.ok ? '空手而回' : r.over ? '買到，但超支' : '買到';
            return '<li class="' + (a.id === pr.pick ? 'is-mine ' : '') + (!r.ok ? 'is-bad' : r.over ? 'is-warn' : 'is-ok') + '">' +
              '<b>' + esc(a.name) + (a.id === pr.pick ? '（你選的）' : '') + '</b>：' + esc(verdict) + '，共花 ' + r.total.toLocaleString() + ' 元。' +
              '<span class="cg-muted">' + esc(r.note) + '</span></li>';
          }).join('') + '</ul>';
        grid.appendChild(box);
      });
      w.appendChild(grid);
      w.appendChild(h('p', 'cg-lesson', esc(P.lesson)));
      w.appendChild(h('p', 'cg-muted', '每位代購對應的公司做法：' + P.agents.map((a) => esc(a.name) + '＝' + esc(a.maps)).join('；') + '。'));
      const q = h('section', 'cg-card');
      q.appendChild(h('h2', '', '第二輪'));
      q.appendChild(h('p', '', esc(P.round2.question)));
      if (pr.round2 == null) {
        const opts = h('div', 'cg-actions cg-stack');
        P.round2.options.forEach((o, i) => opts.appendChild(btn(esc(o), '', () => safeAct('prologue/round2', { option: i }), { 'data-id': 'r2-' + i })));
        q.appendChild(opts);
        q.appendChild(errorBox());
      } else {
        const right = pr.round2 === P.round2.answer;
        q.appendChild(h('p', right ? 'cg-ok' : 'cg-bad', (right ? '答對了。' : '這次不用。') + esc(P.round2.explain)));
        q.appendChild(h('p', 'cg-lesson', esc(P.disclosure)));
        const acts = h('div', 'cg-actions');
        acts.appendChild(btn('下一步：選公司', 'primary', () => safeAct('prologue/done')));
        q.appendChild(acts);
      }
      w.appendChild(q);
    },

    company(w) {
      w.appendChild(h('h1', 'cg-title', '選一家公司'));
      w.appendChild(h('p', 'cg-lead', '光看卡片上的線索，猜猜這家公司會遇到什麼氣候風險。'));
      const box = h('div');
      w.appendChild(box);
      CG.ui.renderCompanyPicker(box, { selectedId: S.draft.companyId }, (id) => safeAct('company/pick', { companyId: id }));
      w.appendChild(errorBox());
    },

    site(w) {
      const co = C.company(S.draft.companyId);
      w.appendChild(h('h1', 'cg-title', '選據點：' + esc(co.name)));
      w.appendChild(h('p', 'cg-lead', '據點會決定你遇到哪些實體風險。便宜、方便的地方，風險通常比較高。'));
      const box = h('div');
      w.appendChild(box);
      CG.ui.renderMap(box, { companyId: co.id, selectedTileId: S.draft.tileId }, (id) => safeAct('site/pick', { tileId: id }));
      w.appendChild(h('p', 'cg-muted', '世界會走哪一條路線，開局時已經暗中抽好，結局才揭曉。'));
      const acts = h('div', 'cg-actions');
      acts.appendChild(btn('上一步', '', () => safeAct('site/back')));
      const go = btn('就選這裡，開始', 'primary', () => safeAct('game/start'));
      go.disabled = !S.draft.tileId;
      acts.appendChild(go);
      w.appendChild(acts);
      w.appendChild(errorBox());
    },

    turnIntro(w) {
      const g = S.game;
      const t = g.turnIndex;
      w.appendChild(h('h1', 'cg-title', esc(turnTitle(t))));
      if (t === LAST_TURN) w.appendChild(h('p', 'cg-note', esc(D.text.gapNote)));
      const talk = h('div', 'cg-talk');
      if (t === 0) advisorSay(talk, { text: D.advisor.intro });
      advisorSay(talk, CG.ui.advisorTurnStart(g));
      w.appendChild(talk);
      w.appendChild(h('p', 'cg-muted', '這二十年世界會怎麼走，結算時才知道。' + (t > 0 ? '本回合預算已加入 ' + esc(C.fmtYi(C.company(g.companyId).budget)) + tag('assumed') + '。' : '')));
      const acts = h('div', 'cg-actions');
      acts.appendChild(btn('開始分析', 'primary', () => safeAct('turn/begin')));
      w.appendChild(acts);
      w.appendChild(errorBox());
    },

    step(w) {
      const g = S.game;
      const n = g.stepIndex;
      const prog = h('ol', 'cg-progress');
      prog.setAttribute('aria-label', '六步驟進度');
      D.text.sixSteps.forEach((name, i) => {
        const li = h('li', i < n ? 'is-done' : i === n ? 'is-now' : '', '<span>' + (i + 1) + '</span><em>' + esc(name) + '</em>');
        if (i === n) li.setAttribute('aria-current', 'step');
        prog.appendChild(li);
      });
      w.appendChild(prog);
      w.appendChild(h('h1', 'cg-title', '第 ' + (n + 1) + ' 步：' + esc(D.text.sixSteps[n])));
      if (S.feedback.length) { const fb = h('div', 'cg-talk'); feedbackBlock(fb); w.appendChild(fb); }
      STEPS[n](w, g, g.turns[g.turnIndex]);
    },

    settle(w) {
      const g = S.game;
      const t = g.turnIndex;
      const out = g.turns[t].outcome;
      const route = C.route(g.routeId);
      w.appendChild(h('h1', 'cg-title', '結算：' + esc(D.turns[t].name + ' ' + D.turns[t].years)));
      if (S.feedback.length) { const fb = h('div', 'cg-talk'); feedbackBlock(fb); w.appendChild(fb); }
      w.appendChild(h('h2', 'cg-sub', '這二十年發生的事'));
      const cards = h('div');
      w.appendChild(cards);
      CG.ui.renderEventCards(cards, out.events, { companyId: g.companyId, turnIndex: t });
      const m = h('section', 'cg-card cg-meters');
      const th = D.rules.capacityThreshold;
      const capOk = out.capacity >= th;
      const cfOk = out.cf >= 0;
      m.innerHTML = '<h2>兩個儀表</h2>' +
        '<div class="cg-meter"><div class="cg-meter-head"><span>產能</span><b class="' + (capOk ? 'cg-ok' : 'cg-bad') + '">' + esc(C.fmtPct(out.capacity)) + (capOk ? '' : '（低於 ' + th + '%，營運中斷）') + '</b></div>' +
        '<div class="cg-bar" role="img" aria-label="產能 ' + esc(C.fmtPct(out.capacity)) + '，門檻 ' + th + '%"><i style="width:' + out.capacity + '%"></i><s style="left:' + th + '%"></s></div></div>' +
        '<div class="cg-meter"><div class="cg-meter-head"><span>年現金流</span><b class="' + (cfOk ? 'cg-ok' : 'cg-bad') + '">' + esc(C.fmtYi(out.cf)) + (cfOk ? '' : '（轉負）') + '</b></div></div>' +
        '<p class="cg-muted">年現金流＝營收 × 產能 − 固定成本 ± 據點差異 − 措施的每年成本 ± 事件影響。公司數字都是' + tag('assumed') + '。</p>';
      w.appendChild(m);
      const world = h('section', 'cg-card cg-world');
      const pips = (v) => '<span class="cg-pips" aria-label="' + v + '／5">' + [1, 2, 3, 4, 5].map((i) => '<i class="' + (i <= v ? 'on' : '') + '"></i>').join('') + '</span>';
      world.innerHTML = '<h2>世界進度條</h2>' +
        '<p><span>氣候階段</span>' + pips(route.climatePhase[t]) + '</p>' +
        '<p><span>政策壓力</span>' + pips(route.policyPressure[t]) + '</p>' +
        '<p class="cg-muted">' + esc(D.text.worldNote) + tag('assumed') + '</p>';
      w.appendChild(world);
      const acts = h('div', 'cg-actions');
      acts.appendChild(btn(t < LAST_TURN ? '下一回合' : '看結局', 'primary', () => safeAct('turn/next')));
      w.appendChild(acts);
      w.appendChild(errorBox());
    },

    ending(w) {
      const g = S.game;
      const bought = C.boughtByTurn(g);
      const actual = C.evaluate({ companyId: g.companyId, tileId: g.tileId, routeId: g.routeId, boughtByTurn: bought });
      const other = C.evaluate({ companyId: g.companyId, tileId: g.tileId, routeId: C.otherRoute(g.routeId), boughtByTurn: bought });
      const box = h('div');
      w.appendChild(box);
      CG.ui.renderEnding(box, { game: g, actual: actual, other: other, rows: C.summaryRows(g, actual), learning: C.learningRecord(g) },
        { onReplay: (mode) => safeAct('replay', { mode: mode }) });
      w.appendChild(errorBox());
    }
  };

  /* ---------- 六步驟的表單 ---------- */
  function checkbox(name, value, label, checked, extraCls) {
    return '<label class="cg-check' + (extraCls ? ' ' + extraCls : '') + '"><input type="checkbox" name="' + name + '" value="' + esc(value) + '"' +
      (checked ? ' checked' : '') + ' data-key="' + esc(name + ':' + value) + '"><span>' + label + '</span></label>';
  }
  function submitRow(w, label, onClick, disabled) {
    const acts = h('div', 'cg-actions');
    const b = btn(label, 'primary', onClick);
    b.disabled = !!disabled;
    acts.appendChild(b);
    w.appendChild(acts);
    w.appendChild(errorBox());
    return b;
  }

  const STEPS = [
    /* 第 1 步：辨識攸關領域 */
    function (w, g) {
      const co = C.company(g.companyId);
      const card = h('section', 'cg-card');
      card.innerHTML = '<h2>' + esc(co.name) + '的線索</h2><ul class="cg-clues">' +
        co.clues.map((c, i) => '<li>' + esc(c) + tag((co.clueSrc || {})[i]) + '</li>').join('') + '</ul>' +
        '<p><b>SASB 主題：</b>' + co.sasb.map(esc).join('、') + '</p>' +
        '<p><b>據點：</b>' + esc(terrainSummary(g.tileId)) + '</p>';
      w.appendChild(card);
      w.appendChild(h('p', 'cg-lead', '勾選這家公司需要分析的氣候風險。'));
      const form = h('div', 'cg-form');
      const group = (kind, title, cls) => '<fieldset class="cg-group ' + cls + '"><legend>' + title + '</legend>' +
        D.risks.filter((r) => r.kind === kind).map((r) => checkbox('risk', r.id, esc(r.name))).join('') + '</fieldset>';
      form.innerHTML = group('physical', '實體風險', 'is-phys') + group('transition', '轉型風險', 'is-trans') +
        '<fieldset class="cg-group"><legend>都不相關</legend>' + checkbox('risk', 'none', '找不到攸關的氣候風險') + '</fieldset>';
      w.appendChild(form);
      const go = submitRow(w, '送出這一步', () => {
        safeAct('step1', { risks: [...form.querySelectorAll('input:checked')].map((x) => x.value) });
      }, true);
      form.addEventListener('change', (e) => {
        const x = e.target;
        if (x.checked && x.value === 'none') form.querySelectorAll('input').forEach((y) => { if (y !== x) y.checked = false; });
        if (x.checked && x.value !== 'none') form.querySelector('input[value="none"]').checked = false;
        go.disabled = !form.querySelector('input:checked');
      });
    },

    /* 第 2 步：下載情境資料 */
    function (w, g) {
      const t = g.turnIndex;
      const co = C.company(g.companyId);
      if (!local.families) local.families = [];
      const bonus = C.ermCountBefore(g, t);
      w.appendChild(h('p', 'cg-lead', '依公司的 SASB 主題與營運型態，選要下載哪幾類情境資料。可以複選。'));
      w.appendChild(h('p', 'cg-muted', '本回合分析點：' + co.ap + (bonus ? ' ＋ ' + bonus + '（納入風險管理的加分）' : '') + '。選到不相關的資料，每類扣 ' + D.rules.irrelevantFamilyApCost + ' 點。'));
      const box = h('div');
      w.appendChild(box);
      let go;
      const draw = () => {
        CG.ui.renderDatabaseCards(box, { selected: local.families.slice(), onToggle: (id) => {
          const sel = new Set(local.families);
          if (sel.has(id)) sel.delete(id);
          else if (id === 'none') { sel.clear(); sel.add('none'); }
          else { sel.delete('none'); sel.add(id); }
          local.families = FAMILY_IDS.filter((f) => sel.has(f));
          draw();
          const again = box.querySelector('[data-family="' + id + '"]');
          if (again) again.focus();
          if (go) go.disabled = local.families.length === 0;
        } });
      };
      draw();
      go = submitRow(w, '送出這一步', () => safeAct('step2', { families: local.families.slice() }), local.families.length === 0);
    },

    /* 第 3 步：查參數 */
    function (w, g, tr) {
      const notNeeded = !(tr.families || []).some((f) => f !== 'none');
      if (notNeeded) {
        w.appendChild(h('p', 'cg-lead', '你在第 2 步判斷不需要下載資料，這一步沒有參數要查。'));
        submitRow(w, '下一步', () => safeAct('step3', { scenarios: [] }));
        return;
      }
      if (!local.scen) local.scen = [];
      w.appendChild(h('p', 'cg-lead', '選要拿來壓力測試的情境（1 到 3 個）。情境分析不是押一個未來，而是兩頭都測。'));
      const chips = h('div', 'cg-scens');
      const params = h('div');
      let go;
      const drawParams = () => {
        params.innerHTML = '';
        if (local.scen.length) CG.ui.renderParameterCards(params, { families: tr.families.slice(), scenarios: local.scen.slice(), turnIndex: g.turnIndex });
        else params.appendChild(h('p', 'cg-muted', '選了情境，這裡會出現參數卡。'));
      };
      D.scenarios.forEach((sc) => {
        const b = btn('<b>' + esc(sc.name) + '</b><span>' + esc(sc.desc) + '</span>', 'cg-scen', () => {
          const on = local.scen.includes(sc.id);
          local.scen = on ? local.scen.filter((x) => x !== sc.id) : SCEN_IDS.filter((x) => x === sc.id || local.scen.includes(x));
          b.setAttribute('aria-pressed', String(!on));
          drawParams();
          go.disabled = local.scen.length < 1 || local.scen.length > 3;
        }, { 'aria-pressed': String(local.scen.includes(sc.id)), 'data-scen': sc.id });
        chips.appendChild(b);
      });
      w.appendChild(chips);
      w.appendChild(params);
      drawParams();
      go = submitRow(w, '送出這一步', () => safeAct('step3', { scenarios: local.scen.slice() }), local.scen.length < 1);
    },

    /* 第 4 步：結合內部資料估影響 */
    function (w, g) {
      const t = g.turnIndex;
      const co = C.company(g.companyId);
      const ap = C.apAvailable(g, t);
      const tr = g.turns[t];
      const bonus = C.ermCountBefore(g, t);
      w.appendChild(h('p', 'cg-lead', esc(D.text.proportionality)));
      w.appendChild(h('p', 'cg-muted', '本回合分析點 ' + ap + '（基本 ' + co.ap + (bonus ? '，納入風險管理加 ' + bonus : '') + (tr.apPenalty ? '，不相關資料扣 ' + tr.apPenalty : '') + '）。分析深度超過需要，會多花預算。'));
      const form = h('div', 'cg-depths');
      D.rules.depthOrder.forEach((id) => {
        const d = D.rules.depths[id];
        const can = d.cost <= ap;
        form.insertAdjacentHTML('beforeend', '<label class="cg-radio' + (can ? '' : ' is-off') + '"><input type="radio" name="depth" value="' + id + '"' + (can ? '' : ' disabled') + ' data-key="depth:' + id + '">' +
          '<span><b>' + esc(d.name) + '</b>（' + d.cost + ' 點）<br>' + esc(d.desc) + (can ? '' : '<br><em>分析點不夠</em>') + '</span></label>');
      });
      w.appendChild(form);
      const go = submitRow(w, '送出這一步', () => {
        const x = form.querySelector('input:checked');
        if (x) safeAct('step4', { depth: x.value });
      }, true);
      form.addEventListener('change', () => { go.disabled = !form.querySelector('input:checked'); });
    },

    /* 第 5 步：評估韌性 */
    function (w, g) {
      const t = g.turnIndex;
      const routes = routesToAnswer(g, t);
      if (!local.pred) local.pred = {};
      w.appendChild(h('p', 'cg-lead', '照目前的措施、之後不再加碼，看到長期。依你的分析回答兩個問題。'));
      const fc = h('div');
      w.appendChild(fc);
      CG.ui.renderForecast(fc, { game: g, turnIndex: t, routeIds: routes.length ? routes : [], extraMeasureIds: [] });
      if (!routes.length) {
        w.appendChild(h('p', 'cg-note', '你沒有選到高排放或積極減碳的情境，這回合沒辦法做壓力測試。'));
        submitRow(w, '下一步', () => safeAct('step5', { predictions: {} }));
        return;
      }
      let go;
      const ready = () => routes.every((r) => local.pred[r] && typeof local.pred[r].q1 === 'boolean' && typeof local.pred[r].q2 === 'boolean');
      routes.forEach((r) => {
        const sec = h('section', 'cg-card cg-ask');
        sec.appendChild(h('h2', '', '若世界走「' + esc(D.routes[r].name) + '」'));
        ['q1', 'q2'].forEach((q, qi) => {
          const row = h('div', 'cg-ask-row');
          row.appendChild(h('p', '', esc(D.text.twoQuestions[qi])));
          const pair = h('div', 'cg-pair');
          [[true, '會'], [false, '不會']].forEach(([val, lab]) => {
            const cur = local.pred[r] && local.pred[r][q];
            const b = btn(lab, 'cg-choice', () => {
              local.pred[r] = Object.assign({}, local.pred[r], { [q]: val });
              pair.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', 'false'));
              b.setAttribute('aria-pressed', 'true');
              go.disabled = !ready();
            }, { 'aria-pressed': String(cur === val), 'data-key': r + q + lab });
            pair.appendChild(b);
          });
          row.appendChild(pair);
          sec.appendChild(row);
        });
        w.appendChild(sec);
      });
      go = submitRow(w, '送出這一步', () => safeAct('step5', { predictions: clone(local.pred) }), !ready());
    },

    /* 第 6 步：納入既有風險管理 */
    function (w, g) {
      const t = g.turnIndex;
      const co = C.company(g.companyId);
      const prior = g.turns.slice(0, t).flatMap((x) => x.bought || []);
      const routes = routesToAnswer(g, t);
      w.appendChild(h('p', 'cg-lead', '決定調適措施，並把風險交給負責單位、設好監控指標。做到後者，之後每回合分析點 +' + D.rules.ermBonus + '。'));
      const ms = h('fieldset', 'cg-group cg-measures');
      ms.innerHTML = '<legend>調適措施（金額為' + tag('assumed') + '）</legend>' + C.measuresFor(co.id).map((m) => {
        const owned = prior.includes(m.id);
        const opex = C.measureOpex(m.id, co.id);
        return '<label class="cg-check cg-measure' + (owned ? ' is-off' : '') + '"><input type="checkbox" name="measure" value="' + m.id + '"' + (owned ? ' disabled' : '') + ' data-key="m:' + m.id + '">' +
          '<span><b>' + esc(m.name) + '</b>' + (owned ? '（已採用）' : '') + '<br>一次 ' + esc(C.fmtYi(C.measureCost(m.id, co.id))) +
          (opex ? '，每年 ' + esc(C.fmtYi(opex)) : '') + '<br><small>' + esc(m.desc) + '</small></span></label>';
      }).join('');
      w.appendChild(ms);
      const money = h('p', 'cg-money');
      w.appendChild(money);
      const erm = h('fieldset', 'cg-group');
      erm.innerHTML = '<legend>納入既有風險管理</legend>' +
        '<label class="cg-select"><span>負責單位</span><select name="owner" data-key="owner"><option value="">（還沒指派）</option>' +
        D.erm.owners.map((o) => '<option>' + esc(o) + '</option>').join('') + '</select></label>' +
        '<p class="cg-muted">監控指標（可複選）</p>' + D.erm.kris.map((k) => checkbox('kri', k.id, esc(k.name))).join('');
      w.appendChild(erm);
      const fc = h('div');
      w.appendChild(h('h2', 'cg-sub', '買了之後的預估'));
      w.appendChild(fc);
      let go;
      const picked = () => [...ms.querySelectorAll('input:checked')].map((x) => x.value);
      const update = () => {
        const sel = picked();
        const cost = C.round(sel.reduce((s, id) => s + C.measureCost(id, co.id), 0), 2);
        const left = C.round(g.budget - cost, 2);
        money.innerHTML = '可用預算 ' + esc(C.fmtYi(g.budget)) + '，已選 ' + esc(C.fmtYi(cost)) + '，剩 <b class="' + (left < 0 ? 'cg-bad' : '') + '">' + esc(C.fmtYi(left)) + '</b>' + (left < 0 ? '（超出預算）' : '');
        fc.innerHTML = '';
        if (routes.length) CG.ui.renderForecast(fc, { game: g, turnIndex: t, routeIds: routes, extraMeasureIds: sel });
        else fc.appendChild(h('p', 'cg-muted', '你沒有選到極端情境，看不到預估。'));
        if (go) go.disabled = left < 0;
      };
      ms.addEventListener('change', update);
      go = submitRow(w, '決定，快轉二十年', () => {
        safeAct('step6', { bought: picked(), erm: { owner: erm.querySelector('select').value || null, kris: [...erm.querySelectorAll('input:checked')].map((x) => x.value) } });
      }, false);
      update();
    }
  ];

  /* ---------- 對外介面 ---------- */
  CG.app = {
    start(el) { root = el; local = {}; localKey = ''; render(); },
    reset() { S = initState(); local = {}; localKey = ''; if (root) render(); return clone(S); },
    getState() { return clone(S); },
    act: act
  };

  CG.debug = {
    autoplay(companyId, tileId, routeId, plan) {
      plan = plan || {};
      const pick = (key, t, fallback) => (plan[key] && plan[key][t] !== undefined ? plan[key][t] : fallback);
      CG.app.reset();
      act('title/start');
      act('prologue/skip');
      act('company/pick', { companyId: companyId });
      act('site/pick', { tileId: tileId });
      act('game/start', { routeId: routeId });
      const rel = C.relevantRisks(companyId, tileId);
      for (let t = 0; t <= LAST_TURN; t++) {
        act('turn/begin');
        act('step1', { risks: pick('risks', t, rel.length ? rel : ['none']) });
        const fams = pick('families', t, C.requiredFamilies(companyId, tileId));
        act('step2', { families: fams });
        const notNeeded = !fams.some((f) => f !== 'none');
        act('step3', { scenarios: pick('scenarios', t, notNeeded ? [] : ['SSP5-8.5', 'SSP1-1.9']) });
        const ap = C.apAvailable(S.game, t);
        act('step4', { depth: pick('depth', t, C.correctDepth(companyId, ap)) });
        act('step5', { predictions: truthsFor(S.game, t, routesToAnswer(S.game, t)) });
        const kri = rel.length ? D.erm.kris.find((k) => k.risks.some((r) => rel.includes(r))) : D.erm.kris.find((k) => k.id === 'kriReview');
        act('step6', { bought: pick('bought', t, []), erm: pick('erm', t, { owner: D.erm.owners[0], kris: [kri.id] }) });
        act('turn/next');
      }
      const g = S.game;
      const bought = C.boughtByTurn(g);
      return {
        app: clone(S),
        actual: C.evaluate({ companyId: companyId, tileId: tileId, routeId: g.routeId, boughtByTurn: bought }),
        other: C.evaluate({ companyId: companyId, tileId: tileId, routeId: C.otherRoute(g.routeId), boughtByTurn: bought })
      };
    }
  };
})();
/* ==== END:ENGINE ==== */
</script>

<script>
/* ==== REGION:MAP ==== 擁有者：T2（公司卡選擇、虛構地圖、格子資訊、選廠址） */
(function () {
  'use strict';
  const D = GAME_DATA;
  const C = CG.core;
  const ui = CG.ui;
  const esc = (s) => ui.esc(s);
  const HAZARD_NAMES = { flood: '淹水', sealevel: '海平面上升', heat: '高溫', slope: '強降雨坡地災害' };
  const level = (v) => (v >= 1.2 ? '高' : v >= 0.8 ? '中' : v >= 0.4 ? '低' : '');
  const LEVEL_CLS = { '高': 'is-hi', '中': 'is-mid', '低': 'is-lo' };

  ui.renderCompanyPicker = function (el, ctx, onPick) {
    const selected = ctx && ctx.selectedId;
    el.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'mp-companies';
    D.companies.forEach((co) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'mp-co';
      b.dataset.id = co.id;
      b.setAttribute('aria-pressed', String(co.id === selected));
      b.innerHTML =
        '<span class="mp-co-head"><span class="mp-co-name">' + esc(co.name) + '</span>' +
        '<span class="mp-case' + (co.caseRef ? '' : ' is-extra') + '">' + esc(co.caseRef || '補充案例') + '</span></span>' +
        '<span class="mp-co-meta">' + esc(co.industry) + '・' + esc(co.size) + '</span>' +
        '<span class="mp-tags">' + co.sasb.map((t) => '<span class="mp-tag">' + esc(t) + '</span>').join('') + '</span>' +
        '<span class="mp-clues">' + co.clues.map((c, i) => '<span class="mp-clue">' + esc(c) + ui.srcTag((co.clueSrc || {})[i]) + '</span>').join('') + '</span>' +
        '<span class="mp-co-foot">每回合預算 ' + esc(C.fmtYi(co.budget)) + '・分析點 ' + co.ap + ui.srcTag(D.companyNumbersSrc) + '</span>';
      b.addEventListener('click', () => onPick(co.id));
      grid.appendChild(b);
    });
    el.appendChild(grid);
    const note = document.createElement('p');
    note.className = 'mp-note';
    note.textContent = D.text.sasbNote;
    el.appendChild(note);
  };

  ui.renderMap = function (el, ctx, onPick) {
    const co = C.company(ctx && ctx.companyId);
    const selected = ctx && ctx.selectedTileId;
    const tiles = C.tiles();
    const cols = D.map.rows[0].length;
    el.innerHTML = '';

    const head = document.createElement('div');
    head.className = 'mp-head';
    head.innerHTML = '<h2>' + esc(D.map.name) + '</h2><p>' + esc(D.map.note) + '</p>';
    el.appendChild(head);

    const legend = document.createElement('p');
    legend.className = 'mp-legend';
    legend.innerHTML = Object.entries(D.hazardBadges).map(([k, ch]) => '<span><b>' + esc(ch) + '</b>＝' + esc(HAZARD_NAMES[k]) + '</span>').join('') +
      '<span>高／中／低＝風險係數' + ui.srcTag(D.terrainSrc) + '</span>' +
      '<span><i class="mp-case-dot is-legend" aria-hidden="true"></i>' + esc(D.map.caseHint.text) + '</span>';
    el.appendChild(legend);

    const grid = document.createElement('div');
    grid.className = 'mp-grid';
    grid.setAttribute('role', 'group');
    grid.setAttribute('aria-label', D.map.name + '地圖，' + D.map.rows.length + ' 列 ' + cols + ' 欄');
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
    tiles.forEach((t) => {
      const terr = C.terrainOf(t.id);
      const badges = Object.entries(D.hazardBadges).map(([k, ch]) => ({ ch: ch, k: k, lv: level(terr.hazards[k]) })).filter((x) => x.lv);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'mp-tile t-' + t.terrain + (t.id === selected ? ' is-on' : '');
      b.dataset.tile = t.id;
      b.setAttribute('aria-pressed', String(t.id === selected));
      b.setAttribute('aria-label', '第 ' + (t.row + 1) + ' 列第 ' + (t.col + 1) + ' 欄，' + terr.name +
        (badges.length ? '，' + badges.map((x) => HAZARD_NAMES[x.k] + x.lv).join('、') : ''));
      b.innerHTML = '<span class="mp-tname">' + esc(terr.name) + '</span><span class="mp-badges">' +
        badges.map((x) => '<i class="' + LEVEL_CLS[x.lv] + '">' + esc(x.ch + x.lv) + '</i>').join('') + '</span>' +
        (t.terrain === D.map.caseHint.terrain ? '<span class="mp-case-dot" aria-hidden="true"></span>' : '');
      b.addEventListener('click', () => onPick(t.id));
      grid.appendChild(b);
    });
    grid.addEventListener('keydown', (e) => {
      const moves = { ArrowRight: [0, 1], ArrowLeft: [0, -1], ArrowDown: [1, 0], ArrowUp: [-1, 0] };
      const mv = moves[e.key];
      const cur = e.target.closest && e.target.closest('[data-tile]');
      if (!mv || !cur) return;
      const t = C.tile(cur.dataset.tile);
      const r = Math.min(D.map.rows.length - 1, Math.max(0, t.row + mv[0]));
      const c = Math.min(cols - 1, Math.max(0, t.col + mv[1]));
      const next = grid.querySelector('[data-tile="r' + r + 'c' + c + '"]');
      if (next) { e.preventDefault(); next.focus(); }
    });
    el.appendChild(grid);

    const info = document.createElement('div');
    info.className = 'mp-info';
    info.setAttribute('aria-live', 'polite');
    if (selected && C.tile(selected)) {
      const t = C.tile(selected);
      const terr = C.terrainOf(selected);
      info.innerHTML = '<h3>第 ' + (t.row + 1) + ' 列第 ' + (t.col + 1) + ' 欄｜' + esc(terr.name) + '</h3>' +
        '<p><b>優點：</b>' + esc(terr.pros) + '</p><p><b>缺點：</b>' + esc(terr.cons) + '</p>' +
        '<ul class="mp-haz">' + Object.keys(HAZARD_NAMES).map((k) => {
          const lv = level(terr.hazards[k]);
          return '<li><span>' + esc(HAZARD_NAMES[k]) + '</span><i class="' + (LEVEL_CLS[lv] || 'is-none') + '">' + esc(lv || '很低') + '</i></li>';
        }).join('') + '</ul>' +
        (t.terrain === D.map.caseHint.terrain ? '<p class="mp-case-note">' + esc(D.map.caseHint.text) + '</p>' : '') +
        (co && !co.siteSensitive ? '<p class="mp-case-note">' + esc(co.name) + '以線上課程為主，據點影響很小。</p>' : '');
    } else {
      info.innerHTML = '<p class="mp-empty">點一格，看看那裡的優點、缺點和風險。</p>';
    }
    el.appendChild(info);
  };
})();
/* ==== END:MAP ==== */
</script>

<script>
/* ==== REGION:EVENTS ==== 擁有者：T3（顧問台詞、步驟回饋、資料庫卡、參數卡、預估顯示、事件卡） */
(function () {
  'use strict';
  const D = GAME_DATA;
  const C = CG.core;
  const ui = CG.ui;
  const esc = (s) => ui.esc(s);
  const tag = (src) => ui.srcTag(src);
  const F = D.advisor.feedback;
  const KIND = { physical: '實體風險', transition: '轉型風險', opportunity: '機會' };
  const LAST_TURN = D.turns.length - 1;
  const uniq = (a) => Array.from(new Set(a));
  const fill = (tpl, vars) => String(tpl).replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? vars[k] : m));
  const riskNames = (ids) => ids.map((id) => (C.risk(id) || {}).name || id).join('、');
  const famNames = (ids) => ids.map((id) => (C.family(id) || {}).name || id).join('、');
  const measureNames = (ids) => ids.map((id) => (C.measure(id) || {}).name || id);
  const yi = (n) => C.fmtYi(Math.abs(n));
  const signYi = (n) => (n < 0 ? '−' : '+') + yi(n);
  const pts = (n) => C.round(Math.abs(n), 1) + ' 個百分點';

  /* ---------- 顧問台詞 ---------- */
  ui.advisorTurnStart = function (game) {
    const lines = D.advisor.turnStart[game.companyId] || [];
    const line = lines[game.turnIndex] || { text: '' };
    const terr = C.terrainOf(game.tileId);
    return { text: line.text.replace(/\{site\}/g, terr ? terr.name : '據點'), src: line.src || null };
  };

  ui.feedbackLines = function (n, c, game) {
    const out = [];
    const say = (text, src) => out.push({ text: text, src: src || null });
    if (!c) return out;
    const tr = game && game.turns ? game.turns[game.turnIndex] : null;
    switch (n) {
      case 1:
        if (c.noneCase) {
          if (c.ok) say(F.step1NoneOk);
          else say('這家公司找不到攸關的氣候風險。' + (c.extra.length ? fill(F.step1Extra, { list: riskNames(c.extra) }) : '選「都不相關」就好。'));
          break;
        }
        if (c.ok) { say(F.step1Ok); break; }
        if (c.missing.length) say(fill(F.step1Missing, { list: riskNames(c.missing) }));
        if (c.extra.length) say(fill(F.step1Extra, { list: riskNames(c.extra) }));
        break;
      case 2: {
        const noneCompany = c.required.length === 1 && c.required[0] === 'none';
        if (noneCompany) {
          if (c.ok) say(F.step2NoneOk);
          else say('這家公司查無相關主題，可以直接選「' + C.family('none').name + '」。');
        } else if (c.noneWrong) {
          say(F.step2NoneWrong);
          if (c.missing.length) say(fill(F.step2Missing, { list: famNames(c.missing) }));
        } else {
          if (c.ok) say(F.step2Ok);
          if (c.missing.length) say(fill(F.step2Missing, { list: famNames(c.missing) }));
        }
        if (c.irrelevant.length) say(fill(F.step2Irrelevant, { list: famNames(c.irrelevant), n: c.apPenalty }));
        if (c.showDbLimits) say(F.dbLimits);
        break;
      }
      case 3:
        say(F[{ ok: 'step3Ok', sameSide: 'step3SameSide', reference: 'step3Reference', notNeeded: 'step3NotNeeded' }[c.reason]]);
        break;
      case 4: {
        const order = D.rules.depthOrder;
        const chosen = (tr && tr.depth) || order[order.indexOf(c.correct) + c.diff];
        if (c.ok) say(F[c.reasonKey]);
        else if (c.diff > 0) { say(fill(F.step4Over, { cost: C.fmtYi(c.overCost) })); say(F[c.reasonKey]); }
        else { say(fill(F.step4Under, { depth: (D.rules.depths[chosen] || {}).name || '' })); say(F[c.reasonKey]); }
        break;
      }
      case 5:
        if (!c.total) { say('這回合沒有做壓力測試，兩個問題都答不了。'); break; }
        say(fill(F.step5Score, { n: c.correct, m: c.total }));
        if (tr && tr.truths) {
          Object.keys(tr.truths).forEach((rid) => {
            const x = tr.truths[rid];
            say('完整試算（之後不再加碼）：若走「' + D.routes[rid].name + '」，產能' + (x.q1 ? '會' : '不會') + '中斷，長期現金流' + (x.q2 ? '會' : '不會') + '轉負。', 'assumed');
          });
        }
        break;
      case 6:
        say(c.ok ? F.step6Ok : F.step6Missing);
        break;
      default:
        break;
    }
    return out;
  };

  ui.renderAdvisor = function (el, line) {
    if (!line || !line.text) return;
    const box = document.createElement('div');
    box.className = 'ev-say';
    box.innerHTML = '<div class="ev-avatar" aria-hidden="true"><span>嵐</span></div>' +
      '<div class="ev-bubble"><p class="ev-who">' + esc(D.advisor.name) + '｜' + esc(D.advisor.title) + '</p>' +
      '<p>' + esc(line.text) + (line.src ? tag(line.src) : '') + '</p></div>';
    el.appendChild(box);
  };

  /* ---------- 第 2 步：資料庫卡 ---------- */
  ui.renderDatabaseCards = function (el, ctx) {
    const selected = (ctx && ctx.selected) || [];
    el.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'ev-dbs';
    D.dataFamilies.forEach((f) => {
      const on = selected.includes(f.id);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'ev-db' + (f.id === 'none' ? ' is-none' : '');
      b.dataset.family = f.id;
      b.setAttribute('aria-pressed', String(on));
      b.innerHTML = '<span class="ev-db-top"><span class="ev-db-name">' + esc(f.name) + '</span><span class="ev-db-mark">' + (on ? '已選' : '點一下選取') + '</span></span>' +
        '<span class="ev-db-when"><b>適用：</b>' + esc(f.when) + '</span>' +
        '<span class="ev-db-ex"><b>' + (f.id === 'none' ? '結論：' : '參數例子：') + '</b>' + esc(f.examples) + '</span>' +
        (f.sources.length ? '<span class="ev-db-src">' + f.sources.map((s) => '<span><b>' + esc(s.name) + '</b>' + (s.note ? '：' + esc(s.note) : '') + '</span>').join('') + '</span>' : '');
      b.addEventListener('click', () => ctx.onToggle(f.id));
      grid.appendChild(b);
    });
    el.appendChild(grid);
    const note = document.createElement('p');
    note.className = 'ev-fine';
    note.textContent = D.siteChangeNote;
    el.appendChild(note);
  };

  /* ---------- 第 3 步：參數卡 ---------- */
  ui.renderParameterCards = function (el, ctx) {
    const fams = (ctx.families || []).filter((f) => f !== 'none');
    const t = ctx.turnIndex || 0;
    el.innerHTML = '';
    fams.forEach((fid) => {
      const params = D.parameters.filter((p) => p.family === fid);
      if (!params.length) return;
      const sec = document.createElement('section');
      sec.className = 'ev-params';
      sec.innerHTML = '<h3>' + esc(C.family(fid).name) + '｜' + esc(D.turns[t].name + ' ' + D.turns[t].years) + '</h3>' + params.map((p) => {
        const hasValues = Object.keys(p.values || {}).length > 0;
        return '<div class="ev-param"><p class="ev-param-name">' + esc(p.name) + '</p>' +
          (p.base ? '<p class="ev-param-base">' + esc(p.base) + tag(p.baseSrc) + '</p>' : '') +
          (hasValues ? '<ul>' + ctx.scenarios.map((sid) => {
            const v = p.values[sid] && p.values[sid][t];
            return '<li><span>' + esc(sid) + '</span><span>' + (v ? esc(v.text) + tag(v.src) : '<em>此情境不適用這個參數</em>') + '</span></li>';
          }).join('') + '</ul>' : '') + '</div>';
      }).join('');
      el.appendChild(sec);
    });
    if (!el.children.length) {
      const p = document.createElement('p');
      p.className = 'ev-fine';
      p.textContent = '你選的資料類別沒有對應的參數卡。';
      el.appendChild(p);
    }
  };

  /* ---------- 第 4–6 步：預估（只算看得到的風險） ---------- */
  function levelOf(tr, ev, depth) { return ev.risk ? C.forecastLevel(tr, ev.risk) : depth; }
  const SEEN = ['qualitative', 'simplified', 'full'];

  ui.renderForecast = function (el, ctx) {
    const g = ctx.game;
    const t = ctx.turnIndex;
    const tr = g.turns[t];
    const depth = tr.depth || 'qualitative';
    const co = C.company(g.companyId);
    const prior = g.turns.slice(0, t).flatMap((x) => x.bought || []);
    const ids = uniq(prior.concat(ctx.extraMeasureIds || []));
    const wrap = document.createElement('div');
    wrap.className = 'ev-fc';
    (ctx.routeIds || []).forEach((rid) => {
      const route = D.routes[rid];
      const now = C.project({ companyId: g.companyId, tileId: g.tileId, routeId: rid, turnIndex: t, measureIds: ids });
      const long = C.project({ companyId: g.companyId, tileId: g.tileId, routeId: rid, turnIndex: LAST_TURN, measureIds: ids });
      const visible = (ev) => SEEN.includes(levelOf(tr, ev, depth));
      const lines = [];
      const risksHere = uniq(now.events.filter((e) => e.kind !== 'opportunity' && e.risk).map((e) => e.risk));
      risksHere.forEach((rid2) => {
        const lv = C.forecastLevel(tr, rid2);
        if (!SEEN.includes(lv)) return;
        const evs = now.events.filter((e) => e.risk === rid2 && e.kind !== 'opportunity');
        const cap = evs.filter((e) => e.metric === 'capacity').reduce((s, e) => s + e.value, 0);
        const cf = evs.filter((e) => e.metric === 'cf').reduce((s, e) => s + e.value, 0);
        const parts = [];
        if (lv === 'full') {
          if (cap) parts.push('產能 −' + pts(cap));
          if (cf) parts.push('每年 ' + signYi(cf));
        } else if (lv === 'simplified') {
          if (cap) parts.push('產能影響「' + C.band('capacity', cap, co.id) + '」');
          if (cf) parts.push('現金流影響「' + C.band('cf', cf, co.id) + '」');
        } else {
          if (cap) parts.push('產能會下降');
          if (cf) parts.push(cf < 0 ? '現金流會變差' : '現金流會變好');
        }
        lines.push('<li><b>' + esc(C.risk(rid2).name) + '</b>：' + esc(parts.join('；') || '影響很小') + '</li>');
      });
      const noData = (tr.risks || []).filter((r) => r !== 'none' && C.forecastLevel(tr, r) === 'noData');
      if (noData.length) lines.push('<li class="ev-miss"><b>' + esc(riskNames(noData)) + '</b>：缺資料，估不出來</li>');
      const quiet = (tr.risks || []).filter((r) => r !== 'none' && SEEN.includes(C.forecastLevel(tr, r)) && !risksHere.includes(r));
      if (quiet.length) lines.push('<li class="ev-quiet"><b>' + esc(riskNames(quiet)) + '</b>：這回合在這條路線上影響很小</li>');
      now.events.filter((e) => e.kind === 'opportunity' && visible(e)).forEach((e) => {
        if (e.missed) lines.push('<li class="ev-opp">機會：' + esc(e.title) + '（要先有「' + esc(measureNames(e.extra.requires).join('」或「')) + '」）</li>');
        else lines.push('<li class="ev-opp">機會：' + esc(e.title) + (depth === 'full' ? '，每年 ' + esc(signYi(e.value)) : '') + '</li>');
      });
      const hidden = uniq(now.events.concat(long.events).filter((e) => e.kind !== 'opportunity' && e.risk && e.raw && C.forecastLevel(tr, e.risk) === 'hidden').map((e) => e.risk));
      const vNow = C.meters({ companyId: g.companyId, tileId: g.tileId, measureIds: ids, events: now.events.filter(visible) });
      const vLong = C.meters({ companyId: g.companyId, tileId: g.tileId, measureIds: ids, events: long.events.filter(visible) });
      /* 第一題看的是「從本回合到長期」任一回合，所以列出這段期間的最低產能 */
      let vLow = { capacity: vNow.capacity, turnIndex: t };
      for (let k = t + 1; k <= LAST_TURN; k++) {
        const pk = C.project({ companyId: g.companyId, tileId: g.tileId, routeId: rid, turnIndex: k, measureIds: ids });
        const mk = C.meters({ companyId: g.companyId, tileId: g.tileId, measureIds: ids, events: pk.events.filter(visible) });
        if (mk.capacity < vLow.capacity) vLow = { capacity: mk.capacity, turnIndex: k };
      }
      const lowTxt = vLow.turnIndex === t ? '' : '，到長期最低約 <b>' + esc(C.fmtPct(vLow.capacity)) + '</b>（' + esc(D.turns[vLow.turnIndex].name) + '）';
      let meters;
      if (depth === 'full') {
        meters = '產能：本回合約 <b>' + esc(C.fmtPct(vNow.capacity)) + '</b>' + lowTxt + '（門檻 ' + D.rules.capacityThreshold + '%）。長期年現金流約 <b>' + esc(C.fmtYi(vLong.cf)) + '</b>。';
      } else if (depth === 'simplified') {
        const r = vLong.cf / co.revenue;
        meters = '產能損失：本回合「<b>' + esc(C.band('capacity', 100 - vNow.capacity, co.id)) + '</b>」' +
          (vLow.turnIndex === t ? '' : '，到長期最嚴重時「<b>' + esc(C.band('capacity', 100 - vLow.capacity, co.id)) + '</b>」') +
          '。長期現金流「<b>' + (r >= 0.15 ? '寬裕' : r >= 0.05 ? '普通' : '吃緊') + '</b>」。';
      } else {
        const anyCap = now.events.some((e) => visible(e) && e.metric === 'capacity' && e.value);
        const anyBad = long.events.some((e) => visible(e) && e.value < 0) || anyCap;
        meters = '產能：' + (anyCap ? '可能下降' : '看不出影響') + '；長期現金流：' + (anyBad ? '可能變差' : '看不出影響');
      }
      const sec = document.createElement('section');
      sec.className = 'ev-fc-route';
      sec.innerHTML = '<h3>若世界走「' + esc(route.name) + '」<small>' + esc(route.scenarioNote) + '</small></h3>' +
        '<p class="ev-fc-meters">' + meters + '</p>' +
        (lines.length ? '<ul>' + lines.join('') + '</ul>' : '<p class="ev-fine">你辨識的風險，這回合在這條路線上看不出影響。</p>') +
        (hidden.length ? '<p class="ev-hidden">還有 ' + hidden.length + ' 項風險沒有辨識，看不到。</p>' : '');
      wrap.appendChild(sec);
    });
    const foot = document.createElement('p');
    foot.className = 'ev-fine';
    foot.innerHTML = '精細度依你的分析深度「' + esc(D.rules.depths[depth].name) + '」。只算到你辨識、也下載了資料的風險。' + tag('assumed');
    wrap.appendChild(foot);
    el.appendChild(wrap);
  };

  /* ---------- 結算：事件卡 ---------- */
  ui.renderEventCards = function (el, events, ctx) {
    el.innerHTML = '';
    const list = document.createElement('div');
    list.className = 'ev-cards';
    if (!events || !events.length) {
      const card = document.createElement('article');
      card.className = 'ev-card is-calm';
      card.innerHTML = '<p class="ev-kind">沒有事件</p><p>' + esc(D.noEventText) + '</p>';
      list.appendChild(card);
      el.appendChild(list);
      return;
    }
    const order = { physical: 0, transition: 1, opportunity: 2 };
    events.slice().sort((a, b) => order[a.kind] - order[b.kind]).forEach((e) => {
      const card = document.createElement('article');
      card.className = 'ev-card is-' + e.kind + (e.missed ? ' is-missed' : '');
      card.dataset.kind = e.kind;
      const assumed = e.src === 'assumed' ? tag('assumed') : '';
      let effect = '';
      if (e.missed) {
        effect = '錯過：要先有「' + esc(measureNames(e.extra.requires).join('」或「')) + '」。有的話每年最多 +' + esc(yi(e.raw)) + assumed;
      } else if (e.metric === 'capacity') {
        effect = '產能 −' + esc(pts(e.value)) + assumed;
        if (e.raw !== e.value) effect += '<br><small>調適前 −' + esc(pts(e.raw)) + ' → 調適後 −' + esc(pts(e.value)) + '</small>';
      } else {
        effect = '每年 ' + esc(signYi(e.value)) + (e.id === 'carbonFee' ? '' : assumed);
        if (e.raw !== e.value) effect += '<br><small>調適前 ' + esc(signYi(e.raw)) + ' → 調適後 ' + esc(signYi(e.value)) + '</small>';
      }
      let formula = '';
      if (e.id === 'carbonFee' && e.extra && e.extra.price) {
        const p = e.extra.price;
        const rate = p.usd != null
          ? 'US$' + p.usd + tag(p.src) + ' × 匯率 ' + D.rules.usdToTwd.value + tag(p.fxSrc) + ' ＝ NT$' + p.twd.toLocaleString()
          : 'NT$' + p.twd.toLocaleString() + tag(p.src);
        formula = '<p class="ev-formula">應繳排放 ' + e.extra.emissions + ' 萬噸' +
          (e.extra.emissionsAfter !== e.extra.emissions ? '（減碳後 ' + e.extra.emissionsAfter + ' 萬噸）' : '') + tag(e.extra.emissionsSrc) +
          ' × 費率 ' + rate + '／噸 ＝ <b>' + C.round(Math.abs(e.value), 2) + ' 億元</b></p><p class="ev-fine">' + esc(p.note) + '</p>';
      }
      const by = e.mitigatedBy && e.mitigatedBy.length && !e.missed ? '<p class="ev-by">靠：' + esc(measureNames(e.mitigatedBy).join('、')) + '</p>' : '';
      const longNote = e.extra && e.extra.longNote ? '<p class="ev-long">' + esc(e.extra.longNote.text) + tag(e.extra.longNote.src) + '</p>' : '';
      card.innerHTML = '<p class="ev-kind">' + esc(KIND[e.kind]) + (e.risk ? '・' + esc(C.risk(e.risk).name) : '') + '</p>' +
        '<h3>' + esc(e.title) + '</h3>' +
        '<p>' + esc(e.text) + (e.src === 'demo' && e.id !== 'carbonFee' ? tag('demo') : '') + '</p>' + longNote + formula +
        '<p class="ev-effect">' + effect + '</p>' + by;
      list.appendChild(card);
    });
    el.appendChild(list);
  };
})();
/* ==== END:EVENTS ==== */
</script>

<script>
/* ==== REGION:ENDING ==== 擁有者：T4（兩個韌性問題的評語、另一路線對照、整理表、學習紀錄、重玩） */
(function () {
  'use strict';
  const D = GAME_DATA;
  const C = CG.core;
  const ui = CG.ui;
  const esc = (s) => ui.esc(s);
  const E = D.ending;
  const LAST_TURN = D.turns.length - 1;
  const TH = D.rules.capacityThreshold;
  const fill = (tpl, vars) => String(tpl).replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? vars[k] : m));
  const KIND_CLS = { '實體': 'is-phys', '轉型': 'is-trans', '機會': 'is-opp' };
  const NO_RISK = '無可合理預期的氣候風險';

  function el(tag, cls, html) {
    const x = document.createElement(tag);
    if (cls) x.className = cls;
    if (html != null) x.innerHTML = html;
    return x;
  }

  ui.renderEnding = function (root, ctx, handlers) {
    const g = ctx.game;
    const A = ctx.actual;
    const O = ctx.other;
    const rows = ctx.rows || [];
    const co = C.company(g.companyId);
    const routeName = (id) => D.routes[id].name;
    const noRisk = rows.length === 1 && rows[0].risk === NO_RISK;
    root.innerHTML = '';
    const page = el('div', 'ed-page');
    root.appendChild(page);

    page.appendChild(el('h1', 'ed-title', '結局：' + esc(co.name)));
    const talk = el('div', 'ed-talk');
    const reveal = fill(D.advisor.endingReveal, { route: routeName(A.routeId) });
    if (ui.renderAdvisor) ui.renderAdvisor(talk, { text: reveal });
    else talk.appendChild(el('p', '', esc(reveal)));
    page.appendChild(talk);

    /* 兩個韌性問題 */
    const low = A.turns.reduce((m, t) => (t.capacity < m.capacity ? t : m), A.turns[0]);
    const longCf = A.turns[LAST_TURN].cf;
    const v = E.verdicts[A.verdict];
    const verdict = el('section', 'ed-verdict is-' + A.verdict);
    verdict.setAttribute('data-verdict', A.verdict);
    verdict.innerHTML = '<p class="ed-route">實際路線：' + esc(routeName(A.routeId)) + '（' + esc(D.routes[A.routeId].scenarioNote) + '）</p>' +
      '<p class="ed-badge">' + esc(v.name) + '</p>' +
      '<p class="ed-verdict-text">' + esc(noRisk && A.verdict === 'resilient' ? E.noRiskConclusion : v.text) + '</p>' +
      '<ol class="ed-qs">' +
      '<li><span>' + esc(D.text.twoQuestions[0]) + '</span><b class="' + (A.q1 ? 'ed-bad' : 'ed-ok') + '">' + (A.q1 ? '會' : '不會') + '</b>' +
      '<small>三回合最低產能 ' + esc(C.fmtPct(low.capacity)) + '（' + esc(D.turns[low.turnIndex].name) + '），門檻 ' + TH + '%</small></li>' +
      '<li><span>' + esc(D.text.twoQuestions[1]) + '</span><b class="' + (A.q2 ? 'ed-bad' : 'ed-ok') + '">' + (A.q2 ? '會' : '不會') + '</b>' +
      '<small>長期（' + esc(D.turns[LAST_TURN].years) + '）年現金流 ' + esc(C.fmtYi(longCf)) + '</small></li></ol>';
    page.appendChild(verdict);

    /* 另一條路線對照 */
    const cross = el('section', 'ed-card');
    cross.innerHTML = '<h2>同一套決策，放到另一種未來</h2>' +
      '<p>' + esc(fill(E.crossRoute, { route: routeName(O.routeId), verdict: E.verdicts[O.verdict].name })) + '</p>' +
      (A.verdict === 'resilient' && O.verdict === 'resilient' ? '<p class="ed-ok"><b>' + esc(E.bothOk) + '</b></p>' :
        '<p class="ed-muted">' + esc(D.text.notPrediction) + '</p>');
    const tbl = el('table', 'ed-mini');
    const cell = (x, kind) => {
      const bad = kind === 'cap' ? x.capacity < TH : x.cf < 0;
      const txt = kind === 'cap' ? C.fmtPct(x.capacity) : C.fmtYi(x.cf).replace(' 億元', ' 億');
      return '<td class="' + (bad ? 'ed-cell-bad' : '') + '">' + esc(txt) + (bad ? '<small>' + (kind === 'cap' ? '中斷' : '轉負') + '</small>' : '') + '</td>';
    };
    tbl.innerHTML = '<caption>兩條路線 × 三個回合（產能低於 ' + TH + '% 或現金流小於 0 的格子會標出）</caption>' +
      '<thead><tr><th scope="col">路線・儀表</th>' + D.turns.map((t) => '<th scope="col">' + esc(t.name) + '</th>').join('') + '</tr></thead><tbody>' +
      [A, O].map((R) => {
        const name = esc(routeName(R.routeId)) + (R === A ? '（實際）' : '');
        return '<tr><th scope="row">' + name + '・產能</th>' + R.turns.map((x) => cell(x, 'cap')).join('') + '</tr>' +
          '<tr><th scope="row">' + name + '・年現金流</th>' + R.turns.map((x) => cell(x, 'cf')).join('') + '</tr>';
      }).join('') + '</tbody>';
    const scroller = el('div', 'ed-mini-wrap');
    scroller.appendChild(tbl);
    cross.appendChild(scroller);
    page.appendChild(cross);

    /* 案例整理表 */
    const sum = el('section', 'ed-card');
    sum.innerHTML = '<h2>你的案例整理表</h2><p class="ed-muted">格式比照懶人包的示範案例：風險、影響、調適措施、韌性結論。影響欄的精細度，取決於你當時分析得多深。</p>';
    const table = el('table', 'ed-table');
    const heads = E.tableHeaders;
    table.innerHTML = '<thead><tr>' + heads.map((x) => '<th scope="col">' + esc(x) + '</th>').join('') + '</tr></thead>';
    const body = el('tbody');
    rows.forEach((r) => {
      const tr = el('tr');
      tr.setAttribute('data-row', '');
      const flags = (r.flags || []).map((f) => ui.srcTag(f)).join('');
      const cells = [esc(r.risk), '<span class="ed-kind ' + (KIND_CLS[r.kind] || '') + '">' + esc(r.kind) + '</span>', esc(r.data), esc(r.impact) + flags, esc(r.measures),
        '<b class="' + (/補強|錯過/.test(r.conclusion) ? 'ed-bad' : /中等/.test(r.conclusion) ? 'ed-warn' : 'ed-ok') + '">' + esc(r.conclusion) + '</b>'];
      tr.innerHTML = cells.map((c, i) => (i === 0 ? '<th scope="row" data-label="' + esc(heads[i]) + '">' : '<td data-label="' + esc(heads[i]) + '">') + c + (i === 0 ? '</th>' : '</td>')).join('');
      body.appendChild(tr);
    });
    table.appendChild(body);
    sum.appendChild(table);
    page.appendChild(sum);

    /* 學習紀錄 */
    const learn = el('section', 'ed-card');
    learn.innerHTML = '<h2>六步驟學習紀錄</h2><ol class="ed-learn">' + (ctx.learning || []).map((x) =>
      '<li><span>' + esc(x.step) + '</span><b>' + (x.total ? '答對 ' + x.ok + '／' + x.total : '沒有作答') + '</b></li>').join('') + '</ol>';
    page.appendChild(learn);

    /* 說明與最後一問 */
    const foot = el('section', 'ed-foot');
    foot.innerHTML = '<p>' + esc(D.text.disclaimer) + '</p><p>' + esc(D.text.fictional) + '</p>' +
      '<p>' + esc(D.text.demoLabel) + '的來源：' + esc(D.meta.source) + '。其他數字都是遊戲假設。</p>' +
      '<p class="ed-final">' + esc(E.finalQuestion) + '</p>';
    page.appendChild(foot);

    /* 重玩 */
    const acts = el('div', 'ed-actions');
    [['otherRoute', '同公司，換另一條路線', 'is-primary'], ['changeCompany', '換一家公司', ''], ['restart', '從頭開始', '']].forEach(([mode, label, cls]) => {
      const b = el('button', 'ed-btn ' + cls, esc(label));
      b.type = 'button';
      b.setAttribute('data-replay', mode);
      b.addEventListener('click', () => handlers && handlers.onReplay && handlers.onReplay(mode));
      acts.appendChild(b);
    });
    const pr = el('button', 'ed-btn ed-print', '列印這張表');
    pr.type = 'button';
    pr.addEventListener('click', () => window.print());
    acts.appendChild(pr);
    page.appendChild(acts);
  };
})();
/* ==== END:ENDING ==== */
</script>

<script>
/* ==== REGION:BOOT ==== 擁有者：總指揮 */
document.addEventListener('DOMContentLoaded', function () { CG.app.start(document.getElementById('app')); });
/* ==== END:BOOT ==== */
</script>
</body>
</html>
