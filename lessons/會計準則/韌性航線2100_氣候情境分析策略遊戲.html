/* 按鈕 */
.cg-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);padding:10px 18px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:.95rem;text-align:center;line-height:1.4;}
.cg-btn:hover{border-color:#B9C3D6;}
.cg-btn:focus-visible,.cg-check input:focus-visible+span,.cg-radio input:focus-visible+span,.cg-select select:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.cg-btn.primary{background:var(--night);border-color:var(--night);color:#fff;}
.cg-btn.primary:hover{background:#1F3260;}
.cg-btn[disabled]{opacity:.45;cursor:not-allowed;}
.cg-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.cg-actions .cg-btn{flex:1 1 160px;}
.cg-stack{flex-direction:column;}
.cg-stack .cg-btn{flex:none;width:100%;justify-content:flex-start;text-align:left;}
/* 首頁 */
.cg-hero{background:linear-gradient(180deg,#0C1428 0%,var(--night) 100%);color:#fff;border-radius:var(--radius);padding:28px 20px 24px;margin:4px 0 8px;}
.cg-hero h1{font-size:clamp(1.8rem,8vw,2.6rem);font-weight:900;letter-spacing:.06em;line-height:1.25;}
.cg-hero p{color:#C7D0E4;margin-top:10px;}
.cg-eyebrow{display:inline-block;color:var(--accent)!important;font-weight:700;letter-spacing:.2em;font-size:.78rem;border:1px solid rgba(252,163,17,.5);padding:2px 12px;border-radius:999px;margin:0 0 10px!important;}
/* HUD */
.cg-hud{position:sticky;top:0;z-index:10;background:var(--night);color:#fff;padding:8px 16px;font-size:.84rem;box-shadow:0 2px 8px rgba(20,33,61,.18);}
.cg-hud-row{max-width:728px;margin:0 auto;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;}
.cg-hud-row strong{font-size:.95rem;}
.cg-hud-row span{color:#C7D0E4;}
.cg-hud-stats b{color:#fff;}
/* 序章 */
.cg-agents{display:grid;gap:10px;}
.cg-agent{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:14px 16px;}
.cg-agent-name{font-size:1.05rem;font-weight:800;}
.cg-agent-plan{font-weight:400;margin:4px 0;}
.cg-agent-fee{font-weight:400;font-size:.84rem;color:var(--ink-soft);}
.cg-banner{background:var(--night);color:#fff;border-radius:10px;padding:10px 14px;margin:6px 0 12px;}
.cg-sits{display:grid;gap:10px;}
.cg-sit{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.cg-sit.is-drawn{border:2px solid var(--accent);}
.cg-sit h2{font-size:1rem;font-weight:800;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.cg-sit ul{list-style:none;display:grid;gap:6px;}
.cg-sit li{font-size:.9rem;padding-left:10px;border-left:4px solid var(--line);}
.cg-sit li .cg-muted{display:block;}
.cg-sit li.is-ok{border-left-color:var(--good);}
.cg-sit li.is-warn{border-left-color:var(--warn);}
.cg-sit li.is-bad{border-left-color:var(--bad);}
.cg-sit li.is-mine{background:#F7F9FD;}
.cg-pill{font-size:.72rem;background:var(--accent);color:#14213D;border-radius:999px;padding:1px 8px;font-weight:800;}
.cg-lesson{font-weight:800;background:#EEF3FB;border-radius:10px;padding:12px 14px;margin:12px 0;}
/* 六步驟進度 */
.cg-progress{list-style:none;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:6px 0 4px;}
.cg-progress li{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;color:var(--ink-soft);text-align:center;line-height:1.25;}
.cg-progress li span{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#E3E8F1;font-weight:800;font-size:.8rem;color:var(--ink-soft);}
.cg-progress li em{font-style:normal;}
.cg-progress li.is-done span{background:var(--night);color:#fff;}
.cg-progress li.is-now span{background:var(--accent);color:#14213D;}
.cg-progress li.is-now{color:var(--ink);font-weight:700;}
@media (max-width:420px){.cg-progress li em{display:none;}.cg-progress li.is-now em{display:none;}}
.cg-talk{margin:6px 0 10px;}
/* 表單 */
.cg-form{display:grid;gap:10px;}
.cg-group{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;background:var(--card);margin:10px 0;min-width:0;}
.cg-group legend{font-weight:800;padding:0 6px;font-size:.95rem;}
.cg-group.is-phys{border-left:5px solid var(--phys);}
.cg-group.is-trans{border-left:5px solid var(--trans);}
.cg-check,.cg-radio{display:flex;align-items:flex-start;gap:10px;min-height:var(--tap);padding:10px 4px;cursor:pointer;border-bottom:1px solid #EEF1F6;}
.cg-check:last-child,.cg-radio:last-child{border-bottom:none;}
.cg-check input,.cg-radio input{width:22px;height:22px;margin-top:2px;flex:0 0 auto;accent-color:var(--night);}
.cg-check span,.cg-radio span{flex:1;min-width:0;overflow-wrap:anywhere;}
.cg-check.is-off,.cg-radio.is-off{opacity:.55;cursor:not-allowed;}
.cg-clues{padding-left:1.2em;margin-bottom:6px;}
.cg-depths{display:grid;gap:8px;}
.cg-depths .cg-radio{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;}
.cg-radio em{color:var(--bad);font-style:normal;font-size:.85rem;}
.cg-scens{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:10px;}
.cg-scen{flex-direction:column;align-items:flex-start;text-align:left;font-weight:400;padding:10px 12px;}
.cg-scen b{font-size:1rem;}
.cg-scen span{font-size:.82rem;color:var(--ink-soft);}
.cg-scen[aria-pressed="true"],.cg-choice[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:#fff;}
.cg-scen[aria-pressed="true"] span{color:#C7D0E4;}
.cg-ask h2{font-size:1rem;}
.cg-ask-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid #EEF1F6;}
.cg-ask-row p{flex:1 1 180px;font-weight:700;}
.cg-pair{display:flex;gap:8px;}
.cg-choice{min-width:76px;}
.cg-measures small{color:var(--ink-soft);}
.cg-money{position:sticky;bottom:0;background:#FFFDF6;border:1px solid #F2D27A;border-radius:10px;padding:10px 12px;font-size:.92rem;z-index:5;}
.cg-select{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0 8px;}
.cg-select span{font-weight:700;}
.cg-select select{min-height:var(--tap);padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;max-width:100%;}
/* 結算 */
.cg-meter{margin:8px 0 12px;}
.cg-meter-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;font-weight:700;}
.cg-bar{position:relative;height:14px;background:#E3E8F1;border-radius:999px;margin-top:6px;overflow:hidden;}
.cg-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--night);border-radius:999px;}
.cg-bar s{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--bad);text-decoration:none;}
.cg-world p{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:6px 0;}
.cg-world p>span:first-child{min-width:5em;font-weight:700;}
.cg-pips{display:inline-flex;gap:4px;}
.cg-pips i{width:22px;height:12px;border-radius:3px;background:#E3E8F1;}
.cg-pips i.on{background:var(--trans);}
/* ==== END:STYLE-ENGINE ==== */

/* ==== REGION:STYLE-MAP ==== 擁有者：T2（公司卡、地圖） */
/* 公司卡 */
.mp-companies{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));}
.mp-co{display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:left;width:100%;min-height:var(--tap);padding:14px 16px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);font-weight:400;line-height:1.55;}
.mp-co:hover{border-color:#B9C3D6;box-shadow:0 6px 18px rgba(20,33,61,.08);}
.mp-co:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.mp-co[aria-pressed="true"]{border:2px solid var(--night);}
.mp-co-head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;}
.mp-co-name{font-size:1.15rem;font-weight:900;}
.mp-case{font-size:.72rem;font-weight:800;border-radius:999px;padding:2px 10px;background:rgba(252,163,17,.18);color:#8A5A00;}
.mp-case.is-extra{background:#EAEEF6;color:var(--ink-soft);}
.mp-co-meta{font-size:.85rem;color:var(--ink-soft);}
.mp-tags{display:flex;flex-wrap:wrap;gap:6px;}
.mp-tag{font-size:.76rem;background:#EAF1FB;color:#24508A;border-radius:6px;padding:2px 8px;font-weight:700;}
.mp-clues{display:flex;flex-direction:column;gap:4px;padding:8px 10px;background:#F7F9FC;border-radius:10px;}
.mp-clue{font-size:.9rem;padding-left:12px;position:relative;}
.mp-clue::before{content:"";position:absolute;left:0;top:.65em;width:5px;height:5px;border-radius:50%;background:var(--ink-soft);}
.mp-co-foot{font-size:.8rem;color:var(--ink-soft);}
.mp-note{font-size:.8rem;color:var(--ink-soft);margin-top:10px;}
/* 地圖 */
.mp-head h2{font-size:1.1rem;font-weight:900;}
.mp-head p{font-size:.88rem;color:var(--ink-soft);}
.mp-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--ink-soft);margin:8px 0;}
.mp-legend b{color:var(--ink);}
.mp-grid{display:grid;gap:4px;max-width:560px;margin:6px 0 10px;}
.mp-tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;min-width:0;min-height:58px;padding:5px 2px;
  border:1px solid rgba(30,36,48,.12);border-radius:8px;color:var(--ink);font-weight:400;line-height:1.2;}
.mp-tile:focus-visible{outline:3px solid var(--accent);outline-offset:1px;z-index:1;}
.mp-tile.is-on{outline:3px solid var(--night);outline-offset:-1px;z-index:1;}
.mp-tname{font-size:.68rem;font-weight:800;white-space:nowrap;}
.mp-badges{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;}
.mp-badges i,.mp-haz i{font-style:normal;font-size:.62rem;font-weight:700;border-radius:4px;padding:0 3px;line-height:1.5;}
.is-hi{background:#C53030;color:#fff;}
.is-mid{background:#F6AD55;color:#3A2600;}
.is-lo{background:#E2E8F0;color:#2D3748;}
.is-none{background:transparent;color:var(--ink-soft);}
.t-estuary{background:#CFE3F5;}
.t-coast{background:#D3EEF0;}
.t-plain{background:#E7F1D6;}
.t-city{background:#E6E1EE;}
.t-slope{background:#EFE3CB;}
.t-highland{background:#E0DCD2;}
.mp-case-dot{position:absolute;bottom:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:1px solid #8A5A00;}
.mp-case-dot.is-legend{position:static;display:inline-block;margin-right:4px;vertical-align:middle;}
.mp-info{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-width:560px;}
.mp-info h3{font-size:1rem;font-weight:800;margin-bottom:4px;}
.mp-haz{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;margin:8px 0 4px;}
.mp-haz li{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.86rem;}
.mp-haz i{font-size:.78rem;}
.mp-case-note{font-size:.84rem;background:#FFF4D6;border-radius:8px;padding:6px 10px;margin-top:6px;}
.mp-empty{color:var(--ink-soft);font-size:.9rem;}
/* ==== END:STYLE-MAP ==== */

/* ==== REGION:STYLE-EVENTS ==== 擁有者：T3（顧問、事件卡、資料庫卡、參數卡、預估） */
/* 顧問 */
.ev-say{display:flex;gap:10px;align-items:flex-start;margin:8px 0;}
.ev-avatar{flex:0 0 40px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#2F4A85,var(--night));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;border:2px solid var(--accent);}
.ev-bubble{flex:1;min-width:0;background:#EEF3FB;border-radius:4px 14px 14px 14px;padding:8px 12px;}
.ev-who{font-size:.74rem;font-weight:800;color:#24508A;}
.ev-bubble p+p{margin-top:2px;}
.ev-fine{font-size:.8rem;color:var(--ink-soft);margin-top:6px;}
/* 資料庫卡 */
.ev-dbs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));}
.ev-db{display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:left;min-height:var(--tap);padding:12px 14px;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);font-weight:400;line-height:1.5;}
.ev-db:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.ev-db[aria-pressed="true"]{border:2px solid var(--night);background:#F3F6FC;}
.ev-db-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;}
.ev-db-name{font-weight:900;font-size:1rem;}
.ev-db-mark{font-size:.74rem;border-radius:999px;padding:1px 9px;background:#EAEEF6;color:var(--ink-soft);font-weight:700;}
.ev-db[aria-pressed="true"] .ev-db-mark{background:var(--night);color:#fff;}
.ev-db-when,.ev-db-ex{font-size:.86rem;}
.ev-db-src{display:flex;flex-direction:column;gap:2px;font-size:.82rem;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px;}
.ev-db.is-none{background:#FAFAFA;}
/* 參數卡 */
.ev-params{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;}
.ev-params h3{font-size:.98rem;font-weight:900;margin-bottom:6px;}
.ev-param{padding:8px 0;border-top:1px solid #EEF1F6;}
.ev-param:first-of-type{border-top:none;}
.ev-param-name{font-weight:800;}
.ev-param-base{font-size:.86rem;color:var(--ink-soft);}
.ev-param ul{list-style:none;margin-top:4px;display:grid;gap:4px;}
.ev-param li{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:.88rem;}
.ev-param li span:first-child{font-weight:700;min-width:6.5em;}
.ev-param em{color:var(--ink-soft);font-style:normal;}
/* 預估 */
.ev-fc{display:grid;gap:10px;margin:8px 0;}
.ev-fc-route{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--night);border-radius:12px;padding:12px 14px;}
.ev-fc-route h3{font-size:.98rem;font-weight:900;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;}
.ev-fc-route h3 small{font-weight:400;color:var(--ink-soft);font-size:.8rem;}
.ev-fc-meters{background:#F7F9FC;border-radius:8px;padding:6px 10px;margin:6px 0;font-size:.9rem;}
.ev-fc-route ul{padding-left:1.1em;font-size:.88rem;display:grid;gap:2px;}
.ev-miss{color:var(--bad);}
.ev-quiet{color:var(--ink-soft);}
.ev-opp{color:var(--opp);}
.ev-hidden{font-size:.84rem;color:var(--warn);margin-top:6px;font-weight:700;}
/* 事件卡 */
.ev-cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));margin:8px 0;}
.ev-card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;}
.ev-card h3{font-size:1rem;font-weight:900;margin:2px 0 4px;}
.ev-card p{font-size:.9rem;}
.ev-kind{font-size:.74rem!important;font-weight:800;letter-spacing:.04em;}
.ev-card.is-physical{border-left-color:var(--phys);}
.ev-card.is-physical .ev-kind{color:var(--phys);}
.ev-card.is-transition{border-left-color:var(--trans);}
.ev-card.is-transition .ev-kind{color:var(--trans);}
.ev-card.is-opportunity{border-left-color:var(--opp);}
.ev-card.is-opportunity .ev-kind{color:var(--opp);}
.ev-card.is-missed{background:#FAFAFA;}
.ev-card.is-calm{border-left-color:var(--good);}
.ev-effect{font-weight:800;margin-top:6px;}
.ev-effect small{font-weight:400;color:var(--ink-soft);}
.ev-by{font-size:.84rem!important;color:var(--good);margin-top:2px;}
.ev-long{background:#FFF8E6;border-radius:8px;padding:4px 8px;margin-top:6px;}
.ev-formula{background:#F7F9FC;border-radius:8px;padding:6px 8px;margin-top:6px;font-size:.86rem!important;overflow-wrap:anywhere;}
/* ==== END:STYLE-EVENTS ==== */

/* ==== REGION:STYLE-ENDING ==== 擁有者：T4（結局、整理表） */
.ed-page{display:block;}
.ed-title{font-size:1.35rem;font-weight:900;margin:8px 0 6px;}
.ed-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0;}
.ed-card h2{font-size:1.05rem;font-weight:900;margin-bottom:6px;}
.ed-muted{color:var(--ink-soft);font-size:.86rem;}
.ed-ok{color:var(--good);}
.ed-bad{color:var(--bad);}
.ed-warn{color:var(--warn);}
/* 評語 */
.ed-verdict{border-radius:var(--radius);padding:16px;margin:12px 0;border:2px solid var(--line);background:var(--card);}
.ed-verdict.is-resilient{border-color:var(--good);background:#F0FAF4;}
.ed-verdict.is-partial{border-color:var(--warn);background:#FFF8E6;}
.ed-verdict.is-weak{border-color:var(--bad);background:#FDF1F1;}
.ed-route{font-size:.86rem;color:var(--ink-soft);}
.ed-badge{font-size:1.6rem;font-weight:900;letter-spacing:.06em;margin:2px 0;}
.is-resilient .ed-badge{color:var(--good);}
.is-partial .ed-badge{color:var(--warn);}
.is-weak .ed-badge{color:var(--bad);}
.ed-verdict-text{font-weight:700;}
.ed-qs{list-style:none;display:grid;gap:8px;margin-top:10px;}
.ed-qs li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:rgba(255,255,255,.7);border-radius:10px;padding:8px 12px;}
.ed-qs li b{font-size:1.2rem;}
.ed-qs li small{grid-column:1 / -1;color:var(--ink-soft);}
/* 兩路線小表 */
.ed-mini-wrap{max-width:100%;overflow-x:auto;}
.ed-mini{width:100%;border-collapse:collapse;font-size:.84rem;margin-top:8px;}
.ed-mini caption{text-align:left;font-size:.78rem;color:var(--ink-soft);padding-bottom:4px;}
.ed-mini th,.ed-mini td{border-bottom:1px solid #EEF1F6;padding:6px 4px;text-align:right;white-space:nowrap;}
.ed-mini th[scope="row"]{text-align:left;white-space:normal;font-weight:700;min-width:7em;}
.ed-mini td small{display:block;font-size:.7rem;font-weight:800;}
.ed-cell-bad{color:var(--bad);background:#FDF1F1;}
/* 整理表 */
.ed-table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:8px;}
.ed-table th,.ed-table td{border:1px solid var(--line);padding:8px;vertical-align:top;text-align:left;overflow-wrap:anywhere;}
.ed-table thead th{background:var(--night);color:#fff;font-weight:700;}
.ed-kind{display:inline-block;border-radius:999px;padding:0 8px;font-size:.78rem;font-weight:800;}
.ed-kind.is-phys{background:var(--phys-bg);color:var(--phys);}
.ed-kind.is-trans{background:var(--trans-bg);color:var(--trans);}
.ed-kind.is-opp{background:var(--opp-bg);color:var(--opp);}
@media (max-width:640px){
  .ed-table,.ed-table tbody,.ed-table tr,.ed-table th,.ed-table td{display:block;width:100%;}
  .ed-table thead{display:none;}
  .ed-table tr{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden;background:var(--card);}
  .ed-table th,.ed-table td{border:none;border-top:1px solid #EEF1F6;padding:6px 12px;}
  .ed-table tbody th{background:#F3F6FC;border-top:none;font-size:.98rem;}
  .ed-table td::before,.ed-table tbody th::before{content:attr(data-label);display:block;font-size:.72rem;font-weight:800;color:var(--ink-soft);}
}
/* 學習紀錄 */
.ed-learn{list-style:none;display:grid;gap:4px;counter-reset:s;}
.ed-learn li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #EEF1F6;padding:6px 0;counter-increment:s;}
.ed-learn li span::before{content:counter(s) ". ";color:var(--ink-soft);}
/* 底部 */
.ed-foot{font-size:.82rem;color:var(--ink-soft);margin:16px 0 8px;}
.ed-foot p+p{margin-top:4px;}
.ed-final{font-size:1.15rem;font-weight:900;color:var(--ink);background:#EEF3FB;border-radius:12px;padding:14px;margin-top:12px!important;}

<body>
<div id="app" aria-live="polite"></div>
<noscript>這個遊戲需要開啟 JavaScript 才能玩。</noscript>

<script>
/* ==== REGION:CORE ==== 擁有者：總指揮（規則與介面契約）。Codex 任務只能呼叫，不能修改。 */
window.CG = window.CG || {};
(function () {
  'use strict';
  const D = GAME_DATA;
  const R = D.rules;
  const byId = (arr) => Object.fromEntries(arr.map((x) => [x.id, x]));
  const COMPANIES = byId(D.companies);
  const MEASURES = byId(D.measures);
  const EVENTS = byId(D.events);
  const RISKS = byId(D.risks);
  const FAMILIES = byId(D.dataFamilies);
  const SCENARIOS = byId(D.scenarios);
  const TILES = {};
  const TILE_LIST = [];
  D.map.rows.forEach((row, r) => row.forEach((terrain, c) => {
    const t = { id: 'r' + r + 'c' + c, row: r, col: c, terrain: terrain };
    TILES[t.id] = t; TILE_LIST.push(t);
  }));

  const num = (v) => (v && typeof v === 'object') ? Number(v.value) : Number(v || 0);
  const round = (n, d) => { const k = Math.pow(10, d == null ? 2 : d); return Math.round(n * k) / k; };
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const uniq = (arr) => Array.from(new Set(arr));
  const ROUTE_IDS = ['high', 'netzero'];

  function company(id) { return COMPANIES[id] || null; }
  function measure(id) { return MEASURES[id] || null; }
  function event(id) { return EVENTS[id] || null; }
  function risk(id) { return RISKS[id] || null; }
  function family(id) { return FAMILIES[id] || null; }
  function scenario(id) { return SCENARIOS[id] || null; }
  function route(id) { return D.routes[id] || null; }
  function tile(id) { return TILES[id] || null; }
  function tiles() { return TILE_LIST.map((t) => Object.assign({}, t)); }
  function terrainOf(tileId) {
    const t = TILES[tileId];
    return t ? Object.assign({ id: t.terrain }, D.terrains[t.terrain]) : null;
  }
  function otherRoute(routeId) { return routeId === 'high' ? 'netzero' : 'high'; }

  /* 這家公司在這個廠址，哪些風險算「攸關」 */
  function relevantRisks(companyId, tileId) {
    const co = company(companyId);
    if (!co) return [];
    const set = new Set(co.baseRisks);
    const terr = co.siteSensitive ? terrainOf(tileId) : null;
    if (terr) {
      const h = terr.hazards, th = R.hazardRelevance;
      if (h.flood >= th.flood) set.add('flood');
      if (h.sealevel >= th.sealevel) set.add('sealevel');
      if (h.slope >= th.slope) set.add('rain');
      if (co.heatSensitive && h.heat >= th.heat) set.add('heat');
    }
    return D.risks.map((r) => r.id).filter((id) => set.has(id));
  }

  /* 這家公司該下載哪幾類資料（依 SASB 主題＋實體風險） */
  function requiredFamilies(companyId, tileId) {
    const co = company(companyId);
    if (!co) return [];
    const set = new Set(co.baseFamilies);
    if (relevantRisks(companyId, tileId).some((id) => RISKS[id].kind === 'physical')) set.add('climate');
    if (set.has('none') && set.size > 1) set.delete('none');
    return D.dataFamilies.map((f) => f.id).filter((id) => set.has(id));
  }

  function ermCountBefore(state, turnIndex) {
    let n = 0;
    for (let i = 0; i < turnIndex; i++) if (state.turns[i] && state.turns[i].checks && state.turns[i].checks.step6 && state.turns[i].checks.step6.ok) n++;
    return n;
  }
  /* 本回合可用分析點＝公司基本值＋前面回合做好第 6 步的次數 − 本回合選了不相關資料的扣點 */
  function apAvailable(state, turnIndex) {
    const co = company(state.companyId);
    const t = state.turns[turnIndex] || {};
    return Math.max(1, co.ap + R.ermBonus * ermCountBefore(state, turnIndex) - (t.apPenalty || 0));
  }

  function correctDepth(companyId, ap) {
    const exp = company(companyId).exposure;
    if (exp === 'none' || exp === 'low') return 'qualitative';
    if (exp === 'mid') return 'simplified';
    return ap >= R.depths.full.cost ? 'full' : 'simplified';
  }

  function coverage(scenarioIds) {
    const sides = (scenarioIds || []).map((id) => scenario(id)).filter(Boolean).map((s) => s.side);
    return { high: sides.includes('high'), netzero: sides.includes('netzero'), reference: sides.includes('reference') };
  }

  function measuresFor(companyId) { return D.measures.filter((m) => m.for.includes(companyId)); }
  function measureCost(measureId, companyId) { return round(measure(measureId).costFrac * company(companyId).budget, 2); }
  function measureOpex(measureId, companyId) { return round((measure(measureId).opexFrac || 0) * company(companyId).revenue, 3); }
  function activeMeasures(boughtByTurn, turnIndex) {
    const out = [];
    for (let i = 0; i <= turnIndex; i++) (boughtByTurn[i] || []).forEach((id) => out.push(id));
    return uniq(out);
  }
  function emissionFactor(measureIds) {
    return (measureIds || []).reduce((f, id) => f * (1 - ((measure(id) || {}).emissionCut || 0)), 1);
  }
  function carbonPrice(routeId, turnIndex) {
    const p = route(routeId).carbonPrice[turnIndex];
    const twd = p.twd != null ? p.twd : p.usd * R.usdToTwd.value;
    return { twd: twd, usd: p.usd != null ? p.usd : null, src: p.src, note: p.note, fxSrc: p.usd != null ? R.usdToTwd.src : null };
  }

  /*
   * 算出某回合、某路線下，這家公司被哪些事件打到。
   * 回傳 EventResult[]：
   *   { id, title, kind, risk, metric, raw, value, mitigatedBy[], missed, src, text, extra }
   *   capacity：raw/value 是「產能損失百分點」（正數）
   *   cf：raw/value 是「每年現金流影響（億元）」，負數是損失
   */
  function resolve(o) {
    const co = company(o.companyId);
    if (!co) return [];
    const ids = o.measureIds || [];
    const terr = co.siteSensitive ? terrainOf(o.tileId) : null;
    const out = [];
    D.events.forEach((ev) => {
      if (!ev.appliesTo.includes(co.id)) return;
      if (ev.special === 'carbonFee') {
        const E = num(co.emissions);
        if (E <= 0) return;
        const price = carbonPrice(o.routeId, o.turnIndex);
        const f = emissionFactor(ids);
        const raw = -(E * price.twd) / 1e4;   // 萬噸 × 元／噸 ＝ 萬元；÷ 1e4 → 億元
        out.push({ id: ev.id, title: ev.title, kind: ev.kind, risk: ev.risk, metric: 'cf',
          raw: round(raw, 2), value: round(raw * f, 2),
          mitigatedBy: ids.filter((id) => (measure(id) || {}).emissionCut),
          missed: false, src: price.src, text: ev.text,
          extra: { price: price, emissions: E, emissionsAfter: round(E * f, 2), emissionsSrc: co.emissions.src || null } });
        return;
      }
      const mag = ((ev.magnitude || {})[o.routeId] || [])[o.turnIndex] || 0;
      if (!mag) return;
      const factor = (ev.hazard && terr) ? (terr.hazards[ev.hazard] || 0) : 1;
      const raw = mag * factor;
      if (!raw) return;
      if (ev.requires && !ev.requires.some((id) => ids.includes(id))) {
        out.push({ id: ev.id, title: ev.title, kind: ev.kind, risk: ev.risk, metric: ev.metric,
          raw: round(raw, 2), value: 0, mitigatedBy: [], missed: true, src: 'assumed', text: ev.text, extra: { requires: ev.requires } });
        return;
      }
      let remain = 1;
      const by = [];
      if (ev.kind !== 'opportunity') {
        ids.forEach((id) => {
          const m = measure(id);
          if (!m) return;
          let frac = (m.mitigate && m.mitigate[ev.id]) || 0;
          if (frac) { remain *= (1 - frac); by.push(id); }
          if (m.mitigateAllPhysical && ev.kind === 'physical' && ev.metric === 'capacity') {
            remain *= (1 - m.mitigateAllPhysical);
            if (!by.includes(id)) by.push(id);
          }
        });
      }
      const extra = {};
      if (ev.textLong && o.routeId === 'high' && o.turnIndex === 2 && co.id === 'X') extra.longNote = { text: ev.textLong.high, src: ev.textLong.src };
      out.push({ id: ev.id, title: ev.title, kind: ev.kind, risk: ev.risk, metric: ev.metric,
        raw: round(raw, 2), value: round(raw * remain, 2), mitigatedBy: by, missed: false,
        src: ev.textSrc || 'assumed', text: ev.text, extra: extra });
    });
    return out;
  }

  /* 把事件結果換算成兩個儀表：產能（%）與年現金流（億元） */
  function meters(o) {
    const co = company(o.companyId);
    const ids = o.measureIds || [];
    const events = o.events || [];
    const capLoss = events.filter((e) => e.metric === 'capacity').reduce((s, e) => s + e.value, 0);
    const capacity = clamp(100 - capLoss, 0, 100);
    const revenue = co.revenue * capacity / 100;
    const terr = co.siteSensitive ? terrainOf(o.tileId) : null;
    const siteAdj = terr ? terr.siteAdjFrac * co.revenue : 0;
    const opex = ids.reduce((s, id) => s + measureOpex(id, co.id), 0);
    const eventsCf = events.filter((e) => e.metric === 'cf').reduce((s, e) => s + e.value, 0);
    const cf = revenue - co.fixedCost + siteAdj - opex + eventsCf;
    return { capacity: round(capacity, 1), cf: round(cf, 2),
      parts: { revenue: round(revenue, 2), fixedCost: co.fixedCost, siteAdj: round(siteAdj, 2), opex: round(opex, 2), eventsCf: round(eventsCf, 2), capLoss: round(capLoss, 1) } };
  }

  function project(o) {
    const events = resolve(o);
    return Object.assign({ turnIndex: o.turnIndex, routeId: o.routeId, measureIds: (o.measureIds || []).slice(), events: events }, meters({ companyId: o.companyId, tileId: o.tileId, measureIds: o.measureIds, events: events }));
  }

  function verdict(q1, q2) { return (!q1 && !q2) ? 'resilient' : (q1 && q2) ? 'weak' : 'partial'; }

  /* 用一組「每回合買了哪些措施」跑完三回合，回答兩個韌性問題 */
  function evaluate(o) {
    const turns = D.turns.map((_, t) => project({ companyId: o.companyId, tileId: o.tileId, routeId: o.routeId, turnIndex: t, measureIds: activeMeasures(o.boughtByTurn || [], t) }));
    const q1 = turns.some((x) => x.capacity < R.capacityThreshold);
    const q2 = turns[turns.length - 1].cf < 0;
    return { routeId: o.routeId, turns: turns, q1: q1, q2: q2, verdict: verdict(q1, q2) };
  }

  /* 第 5 步：照目前（含 extra）的措施、之後不再加碼，從本回合看到長期，兩個問題的答案 */
  function assess(state, routeId, turnIndex, extraIds) {
    const bought = state.turns.map((t, i) => (i < turnIndex ? (t.bought || []).slice() : []));
    bought[turnIndex] = (extraIds || []).slice();
    const ev = evaluate({ companyId: state.companyId, tileId: state.tileId, routeId: routeId, boughtByTurn: bought });
    const ahead = ev.turns.slice(turnIndex);
    return { routeId: routeId, turns: ev.turns, q1: ahead.some((x) => x.capacity < R.capacityThreshold), q2: ev.q2 };
  }

  const check = {
    step1(companyId, tileId, selected) {
      const rel = relevantRisks(companyId, tileId);
      const sel = (selected || []).slice();
      if (rel.length === 0) {
        const ok = sel.length === 1 && sel[0] === 'none';
        return { ok: ok, relevant: rel, missing: [], extra: sel.filter((id) => id !== 'none'), noneCase: true };
      }
      const chosen = sel.includes('none') ? [] : sel;
      const missing = rel.filter((id) => !chosen.includes(id));
      const extra = chosen.filter((id) => !rel.includes(id));
      return { ok: missing.length === 0 && extra.length === 0, relevant: rel, missing: missing, extra: extra, noneCase: false };
    },
    step2(companyId, tileId, families) {
      const req = requiredFamilies(companyId, tileId);
      const sel = (families || []).slice();
      if (req.length === 1 && req[0] === 'none') {
        const irrelevant = sel.filter((id) => id !== 'none');
        return { ok: sel.includes('none') && irrelevant.length === 0, required: req, missing: sel.includes('none') ? [] : ['none'],
          irrelevant: irrelevant, apPenalty: irrelevant.length * R.irrelevantFamilyApCost, noneOk: sel.includes('none'), noneWrong: false, showDbLimits: sel.includes('climate') };
      }
      const noneWrong = sel.includes('none');
      const missing = req.filter((id) => !sel.includes(id));
      const irrelevant = sel.filter((id) => id !== 'none' && !req.includes(id));
      return { ok: !noneWrong && missing.length === 0 && irrelevant.length === 0, required: req, missing: missing, irrelevant: irrelevant,
        apPenalty: irrelevant.length * R.irrelevantFamilyApCost, noneOk: false, noneWrong: noneWrong, showDbLimits: sel.includes('climate') };
    },
    step3(scenarioIds, families) {
      const cov = coverage(scenarioIds);
      const fams = (families || []).filter((id) => id !== 'none');
      if (fams.length === 0) return { ok: true, coverage: cov, reason: 'notNeeded' };
      const ok = cov.high && cov.netzero;
      let reason = 'ok';
      if (!ok) reason = (cov.reference && !cov.high && !cov.netzero) ? 'reference' : 'sameSide';
      return { ok: ok, coverage: cov, reason: reason };
    },
    step4(companyId, depth, ap) {
      const order = R.depthOrder;
      const correct = correctDepth(companyId, ap);
      const diff = order.indexOf(depth) - order.indexOf(correct);
      const co = company(companyId);
      const overCost = diff > 0 ? round(diff * R.overAnalysisCostFrac * co.budget, 2) : 0;
      let reasonKey = 'step4Qualitative';
      if (correct === 'full') reasonKey = 'step4Full';
      else if (correct === 'simplified') reasonKey = co.exposure === 'high' ? 'step4SimplifyFirst' : 'step4Simplified';
      return { ok: diff === 0, correct: correct, diff: diff, overCost: overCost, affordable: R.depths[depth] ? R.depths[depth].cost <= ap : false, reasonKey: reasonKey };
    },
    step5(predictions, truths) {
      let n = 0, m = 0;
      Object.keys(truths || {}).forEach((rid) => {
        ['q1', 'q2'].forEach((q) => {
          m++;
          if (predictions && predictions[rid] && predictions[rid][q] === truths[rid][q]) n++;
        });
      });
      return { ok: m > 0 && n === m, correct: n, total: m };
    },
    step6(companyId, tileId, erm) {
      const rel = relevantRisks(companyId, tileId);
      const kris = (erm && erm.kris) || [];
      const owner = erm && erm.owner;
      if (!owner) return { ok: false, reason: 'noOwner' };
      if (rel.length === 0) return { ok: kris.includes('kriReview'), reason: kris.includes('kriReview') ? 'ok' : 'noKri' };
      const hit = D.erm.kris.some((k) => kris.includes(k.id) && k.risks.some((r) => rel.includes(r)));
      return { ok: hit, reason: hit ? 'ok' : 'noKri' };
    }
  };

  /* 這個風險在這回合能看到多細：hidden（沒辨識）／noData（沒下載對的資料）／qualitative／simplified／full */
  function forecastLevel(turnRecord, riskId) {
    if (!turnRecord || !(turnRecord.risks || []).includes(riskId)) return 'hidden';
    const fams = (RISKS[riskId] || {}).families || [];
    if (!fams.some((f) => (turnRecord.families || []).includes(f))) return 'noData';
    return turnRecord.depth || 'qualitative';
  }

  function band(metric, value, companyId) {
    const v = Math.abs(value);
    const table = metric === 'capacity' ? R.bands.capacity : R.bands.cfFrac;
    const x = metric === 'capacity' ? v : v / company(companyId).revenue;
    for (const [lim, name] of table) if (x < lim) return name;
    return table[table.length - 1][1];
  }

  function fmtYi(n) {
    const v = round(n, 2);
    const s = Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2);
    return s.replace(/\.?0+$/, '') + ' 億元';
  }
  function fmtPct(n) { return round(n, 1) + '%'; }

  /* 結局整理表：每列 { risk, kind, data, impact, measures, conclusion, flags[] } */
  function summaryRows(state, actual) {
    const co = company(state.companyId);
    const rel = relevantRisks(state.companyId, state.tileId);
    const allEvents = actual.turns.flatMap((t) => t.events.map((e) => Object.assign({ turnIndex: t.turnIndex }, e)));
    const hitRisks = uniq(allEvents.filter((e) => e.kind !== 'opportunity' && e.risk && e.value !== 0).map((e) => e.risk));
    const riskIds = D.risks.map((r) => r.id).filter((id) => rel.includes(id) || hitRisks.includes(id));
    const scenarioNames = uniq(state.turns.flatMap((t) => t.scenarios || []));
    const rows = [];
    if (riskIds.length === 0) {
      rows.push({ risk: '無可合理預期的氣候風險', kind: '—', data: '查過 SASB 主題，判斷不需下載情境資料', impact: '無',
        measures: '不需要', conclusion: '具韌性', flags: [] });
    }
    riskIds.forEach((rid) => {
      const r = RISKS[rid];
      const levels = state.turns.map((t) => forecastLevel(t, rid));
      const order = ['hidden', 'noData', 'qualitative', 'simplified', 'full'];
      const best = levels.reduce((a, b) => (order.indexOf(b) > order.indexOf(a) ? b : a), 'hidden');
      const famNames = uniq(state.turns.flatMap((t) => (t.families || []).filter((f) => r.families.includes(f)))).map((f) => FAMILIES[f].name);
      const data = famNames.length ? famNames.join('、') + (scenarioNames.length ? '；' + scenarioNames.join('、') : '') : '未下載相關資料';
      const evs = allEvents.filter((e) => e.risk === rid && e.kind !== 'opportunity');
      /* 同一回合、同一種影響先加總，再挑調適前影響最大的那個回合 */
      const perTurn = (metric) => D.turns.map((_, ti) => {
        const list = evs.filter((e) => e.turnIndex === ti && e.metric === metric);
        return { turnIndex: ti, n: list.length, raw: list.reduce((s, e) => s + e.raw, 0), value: list.reduce((s, e) => s + e.value, 0) };
      }).filter((x) => x.n > 0);
      const worst = (metric) => perTurn(metric).reduce((a, x) => (!a || Math.abs(x.raw) > Math.abs(a.raw) ? x : a), null);
      const wc = worst('capacity'), wf = worst('cf');
      const longNote = evs.map((e) => e.extra && e.extra.longNote).find(Boolean);
      const turnName = (e) => D.turns[e.turnIndex].name;
      let impact;
      if (best === 'hidden') impact = '未辨識，沒有分析';
      else if (best === 'noData') impact = '有辨識，但沒下載對的資料，估不出來';
      else {
        const parts = [];
        if (wc) parts.push(best === 'full' ? turnName(wc) + '產能 −' + round(wc.value, 1) + ' 個百分點（調適前 −' + round(wc.raw, 1) + '）'
          : best === 'simplified' ? turnName(wc) + '產能影響「' + band('capacity', wc.raw, co.id) + '」' : '產能會下降');
        if (wf) parts.push(best === 'full' ? turnName(wf) + '每年 ' + (wf.value < 0 ? '−' : '+') + fmtYi(Math.abs(wf.value)) + '（調適前 ' + (wf.raw < 0 ? '−' : '+') + fmtYi(Math.abs(wf.raw)) + '）'
          : best === 'simplified' ? turnName(wf) + '現金流影響「' + band('cf', wf.raw, co.id) + '」' : '現金流會受影響');
        if (!parts.length) parts.push('這條路線上影響很小');
        if (longNote) parts.push(longNote.text);
        impact = parts.join('；');
      }
      const usedMeasures = uniq(evs.flatMap((e) => e.mitigatedBy)).map((id) => MEASURES[id].name);
      /* 調適後最嚴重的殘餘影響：輕微＝已控制；中等＝仍有中等影響；嚴重＝仍需補強 */
      const bands = perTurn('capacity').map((x) => band('capacity', x.value, co.id)).concat(perTurn('cf').map((x) => band('cf', x.value, co.id)));
      const residual = bands.includes('嚴重') ? 2 : bands.includes('中等') ? 1 : 0;
      const flags = [];
      if (rid === 'flood' && co.id === 'X') flags.push('demo');
      if (rid === 'carbonfee') flags.push(evs.some((e) => e.src === 'demo') ? 'demo' : 'assumed');
      rows.push({ risk: r.name, kind: r.kind === 'physical' ? '實體' : '轉型', data: data, impact: impact,
        measures: usedMeasures.length ? usedMeasures.join('、') : '沒有採取措施',
        conclusion: evs.length === 0 ? '這條路線上沒有發生' : residual === 2 ? '仍需補強' : residual === 1 ? '仍有中等影響' : best === 'hidden' ? '影響輕微' : '已控制', flags: flags });
    });
    const opps = uniq(allEvents.filter((e) => e.kind === 'opportunity').map((e) => e.id));
    opps.forEach((id) => {
      const evs = allEvents.filter((e) => e.id === id);
      const got = evs.filter((e) => !e.missed && e.value > 0);
      const missed = evs.filter((e) => e.missed);
      const best = (list, key) => list.reduce((a, e) => Math.max(a, e[key]), 0);
      const ev = EVENTS[id];
      rows.push({ risk: ev.title, kind: '機會', data: '—',
        impact: got.length ? '每年最多 +' + fmtYi(best(got, 'value')) : '錯過：每年最多 +' + fmtYi(best(missed, 'raw')),
        measures: ev.requires ? ev.requires.map((m) => MEASURES[m].name).join(' 或 ') : '本業自然受惠',
        conclusion: got.length ? '已把握' : '錯過機會', flags: [] });
    });
    return rows;
  }

  function learningRecord(state) {
    const steps = D.text.sixSteps;
    return steps.map((name, i) => {
      const key = 'step' + (i + 1);
      let ok = 0, total = 0;
      state.turns.forEach((t) => {
        const c = t.checks && t.checks[key];
        if (!c) return;
        if (key === 'step5') { ok += c.correct; total += c.total; } else { total++; if (c.ok) ok++; }
      });
      return { step: name, ok: ok, total: total };
    });
  }

  function blankTurn() {
    return { risks: [], families: [], scenarios: [], depth: null, predictions: {}, truths: {}, bought: [],
      erm: { owner: null, kris: [] }, checks: {}, apPenalty: 0, overCost: 0, outcome: null };
  }

  /* 開新局。routeId 不給就隨機暗抽（rng 預設 Math.random）。 */
  function newGame(o) {
    const co = company(o.companyId);
    const rng = o.rng || Math.random;
    const routeId = o.routeId || (rng() < 0.5 ? 'high' : 'netzero');
    return { version: 1, companyId: co.id, tileId: o.tileId, routeId: routeId,
      turnIndex: 0, stepIndex: 0, budget: co.budget, spent: 0,
      turns: D.turns.map(blankTurn) };
  }

  /* 結算目前回合（實際路線）：回傳要存進 turns[t].outcome 的東西 */
  function settleTurn(state) {
    const t = state.turnIndex;
    const bought = state.turns.map((x) => (x.bought || []).slice());
    return project({ companyId: state.companyId, tileId: state.tileId, routeId: state.routeId, turnIndex: t, measureIds: activeMeasures(bought, t) });
  }

  function boughtByTurn(state) { return state.turns.map((x) => (x.bought || []).slice()); }

  CG.core = {
    data: D, ROUTE_IDS: ROUTE_IDS,
    company, measure, event, risk, family, scenario, route, tile, tiles, terrainOf, otherRoute,
    relevantRisks, requiredFamilies, apAvailable, ermCountBefore, correctDepth, coverage,
    measuresFor, measureCost, measureOpex, activeMeasures, emissionFactor, carbonPrice,
    resolve, meters, project, evaluate, assess, verdict, check, forecastLevel, band,
    summaryRows, learningRecord, newGame, settleTurn, boughtByTurn,
    fmtYi, fmtPct, round
  };
})();
/* ==== END:CORE ==== */
</script>

<script>
