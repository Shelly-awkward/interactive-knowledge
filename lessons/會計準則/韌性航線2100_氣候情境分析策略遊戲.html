    TILES[t.id] = t; TILE_LIST.push(t);
  }));

  const num = (v) => (v && typeof v === 'object') ? Number(v.value) : Number(v || 0);
  const round = (n, d) => { const k = Math.pow(10, d == null ? 2 : d); return Math.round(n * k) / k; };
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const uniq = (arr) => Array.from(new Set(arr));
  const ROUTE_IDS = ['high', 'netzero'];

  function company(id) { return COMPANIES[id] || null; }
  function measure(id) { return MEASURES[id] || null; }
  function event(id) { return EVENTS[id] || null; }
  function risk(id) { return RISKS[id] || null; }
  function family(id) { return FAMILIES[id] || null; }
  function scenario(id) { return SCENARIOS[id] || null; }
  function route(id) { return D.routes[id] || null; }
  function tile(id) { return TILES[id] || null; }
  function tiles() { return TILE_LIST.map((t) => Object.assign({}, t)); }
  function terrainOf(tileId) {
    const t = TILES[tileId];
    return t ? Object.assign({ id: t.terrain }, D.terrains[t.terrain]) : null;
  }
  function otherRoute(routeId) { return routeId === 'high' ? 'netzero' : 'high'; }

  /* 這家公司在這個廠址，哪些風險算「攸關」 */
  function relevantRisks(companyId, tileId) {
    const co = company(companyId);
    if (!co) return [];
    const set = new Set(co.baseRisks);
    const terr = co.siteSensitive ? terrainOf(tileId) : null;
    if (terr) {
      const h = terr.hazards, th = R.hazardRelevance;
      if (h.flood >= th.flood) set.add('flood');
      if (h.sealevel >= th.sealevel) set.add('sealevel');
      if (h.slope >= th.slope) set.add('rain');
      if (co.heatSensitive && h.heat >= th.heat) set.add('heat');
    }
    return D.risks.map((r) => r.id).filter((id) => set.has(id));
  }

  /* 這家公司該下載哪幾類資料（依 SASB 主題＋實體風險） */
  function requiredFamilies(companyId, tileId) {
    const co = company(companyId);
    if (!co) return [];
    const set = new Set(co.baseFamilies);
    if (relevantRisks(companyId, tileId).some((id) => RISKS[id].kind === 'physical')) set.add('climate');
    if (set.has('none') && set.size > 1) set.delete('none');
    return D.dataFamilies.map((f) => f.id).filter((id) => set.has(id));
  }

  function ermCountBefore(state, turnIndex) {
    let n = 0;
    for (let i = 0; i < turnIndex; i++) if (state.turns[i] && state.turns[i].checks && state.turns[i].checks.step6 && state.turns[i].checks.step6.ok) n++;
    return n;
  }
  /* 本回合可用分析點＝公司基本值＋前面回合做好第 6 步的次數 − 本回合選了不相關資料的扣點 */
  function apAvailable(state, turnIndex) {
    const co = company(state.companyId);
    const t = state.turns[turnIndex] || {};
    return Math.max(1, co.ap + R.ermBonus * ermCountBefore(state, turnIndex) - (t.apPenalty || 0));
  }

  function correctDepth(companyId, ap) {
    const exp = company(companyId).exposure;
    if (exp === 'none' || exp === 'low') return 'qualitative';
    if (exp === 'mid') return 'simplified';
    return ap >= R.depths.full.cost ? 'full' : 'simplified';
  }

  function coverage(scenarioIds) {
    const sides = (scenarioIds || []).map((id) => scenario(id)).filter(Boolean).map((s) => s.side);
    return { high: sides.includes('high'), netzero: sides.includes('netzero'), reference: sides.includes('reference') };
  }

  function measuresFor(companyId) { return D.measures.filter((m) => m.for.includes(companyId)); }
  function measureCost(measureId, companyId) { return round(measure(measureId).costFrac * company(companyId).budget, 2); }
  function measureOpex(measureId, companyId) { return round((measure(measureId).opexFrac || 0) * company(companyId).revenue, 3); }
  function activeMeasures(boughtByTurn, turnIndex) {
    const out = [];
    for (let i = 0; i <= turnIndex; i++) (boughtByTurn[i] || []).forEach((id) => out.push(id));
    return uniq(out);
  }
  function emissionFactor(measureIds) {
    return (measureIds || []).reduce((f, id) => f * (1 - ((measure(id) || {}).emissionCut || 0)), 1);
  }
  function carbonPrice(routeId, turnIndex) {
    const p = route(routeId).carbonPrice[turnIndex];
    const twd = p.twd != null ? p.twd : p.usd * R.usdToTwd.value;
    return { twd: twd, usd: p.usd != null ? p.usd : null, src: p.src, note: p.note, fxSrc: p.usd != null ? R.usdToTwd.src : null };
  }

  /*
   * 算出某回合、某路線下，這家公司被哪些事件打到。
   * 回傳 EventResult[]：
   *   { id, title, kind, risk, metric, raw, value, mitigatedBy[], missed, src, text, extra }
   *   capacity：raw/value 是「產能損失百分點」（正數）
   *   cf：raw/value 是「每年現金流影響（億元）」，負數是損失
   */
  function resolve(o) {
    const co = company(o.companyId);
    if (!co) return [];
    const ids = o.measureIds || [];
    const terr = co.siteSensitive ? terrainOf(o.tileId) : null;
    const out = [];
    D.events.forEach((ev) => {
      if (!ev.appliesTo.includes(co.id)) return;
      if (ev.special === 'carbonFee') {
        const E = num(co.emissions);
        if (E <= 0) return;
        const price = carbonPrice(o.routeId, o.turnIndex);
        const f = emissionFactor(ids);
        const raw = -(E * price.twd) / 1e4;   // 萬噸 × 元／噸 ＝ 萬元；÷ 1e4 → 億元
        out.push({ id: ev.id, title: ev.title, kind: ev.kind, risk: ev.risk, metric: 'cf',
          raw: round(raw, 2), value: round(raw * f, 2),
          mitigatedBy: ids.filter((id) => (measure(id) || {}).emissionCut),
          missed: false, src: price.src, text: ev.text,
          extra: { price: price, emissions: E, emissionsAfter: round(E * f, 2), emissionsSrc: co.emissions.src || null } });
        return;
      }
      const mag = ((ev.magnitude || {})[o.routeId] || [])[o.turnIndex] || 0;
      if (!mag) return;
      const factor = (ev.hazard && terr) ? (terr.hazards[ev.hazard] || 0) : 1;
      const raw = mag * factor;
      if (!raw) return;
      if (ev.requires && !ev.requires.some((id) => ids.includes(id))) {
        out.push({ id: ev.id, title: ev.title, kind: ev.kind, risk: ev.risk, metric: ev.metric,
          raw: round(raw, 2), value: 0, mitigatedBy: [], missed: true, src: 'assumed', text: ev.text, extra: { requires: ev.requires } });
        return;
      }
      let remain = 1;
      const by = [];
      if (ev.kind !== 'opportunity') {
        ids.forEach((id) => {
          const m = measure(id);
          if (!m) return;
          let frac = (m.mitigate && m.mitigate[ev.id]) || 0;
          if (frac) { remain *= (1 - frac); by.push(id); }
          if (m.mitigateAllPhysical && ev.kind === 'physical' && ev.metric === 'capacity') {
            remain *= (1 - m.mitigateAllPhysical);
            if (!by.includes(id)) by.push(id);
          }
        });
      }
      const extra = {};
      if (ev.textLong && o.routeId === 'high' && o.turnIndex === 2 && co.id === 'X') extra.longNote = { text: ev.textLong.high, src: ev.textLong.src };
      out.push({ id: ev.id, title: ev.title, kind: ev.kind, risk: ev.risk, metric: ev.metric,
        raw: round(raw, 2), value: round(raw * remain, 2), mitigatedBy: by, missed: false,
        src: ev.textSrc || 'assumed', text: ev.text, extra: extra });
    });
    return out;
  }

  /* 把事件結果換算成兩個儀表：產能（%）與年現金流（億元） */
  function meters(o) {
    const co = company(o.companyId);
    const ids = o.measureIds || [];
    const events = o.events || [];
    const capLoss = events.filter((e) => e.metric === 'capacity').reduce((s, e) => s + e.value, 0);
    const capacity = clamp(100 - capLoss, 0, 100);
    const revenue = co.revenue * capacity / 100;
    const terr = co.siteSensitive ? terrainOf(o.tileId) : null;
    const siteAdj = terr ? terr.siteAdjFrac * co.revenue : 0;
    const opex = ids.reduce((s, id) => s + measureOpex(id, co.id), 0);
    const eventsCf = events.filter((e) => e.metric === 'cf').reduce((s, e) => s + e.value, 0);
    const cf = revenue - co.fixedCost + siteAdj - opex + eventsCf;
    return { capacity: round(capacity, 1), cf: round(cf, 2),
      parts: { revenue: round(revenue, 2), fixedCost: co.fixedCost, siteAdj: round(siteAdj, 2), opex: round(opex, 2), eventsCf: round(eventsCf, 2), capLoss: round(capLoss, 1) } };
  }

  function project(o) {
    const events = resolve(o);
    return Object.assign({ turnIndex: o.turnIndex, routeId: o.routeId, measureIds: (o.measureIds || []).slice(), events: events }, meters({ companyId: o.companyId, tileId: o.tileId, measureIds: o.measureIds, events: events }));
  }

  function verdict(q1, q2) { return (!q1 && !q2) ? 'resilient' : (q1 && q2) ? 'weak' : 'partial'; }

  /* 用一組「每回合買了哪些措施」跑完三回合，回答兩個韌性問題 */
  function evaluate(o) {
    const turns = D.turns.map((_, t) => project({ companyId: o.companyId, tileId: o.tileId, routeId: o.routeId, turnIndex: t, measureIds: activeMeasures(o.boughtByTurn || [], t) }));
    const q1 = turns.some((x) => x.capacity < R.capacityThreshold);
    const q2 = turns[turns.length - 1].cf < 0;
    return { routeId: o.routeId, turns: turns, q1: q1, q2: q2, verdict: verdict(q1, q2) };
  }

  /* 第 5 步：照目前（含 extra）的措施、之後不再加碼，從本回合看到長期，兩個問題的答案 */
  function assess(state, routeId, turnIndex, extraIds) {
    const bought = state.turns.map((t, i) => (i < turnIndex ? (t.bought || []).slice() : []));
    bought[turnIndex] = (extraIds || []).slice();
    const ev = evaluate({ companyId: state.companyId, tileId: state.tileId, routeId: routeId, boughtByTurn: bought });
    const ahead = ev.turns.slice(turnIndex);
    return { routeId: routeId, turns: ev.turns, q1: ahead.some((x) => x.capacity < R.capacityThreshold), q2: ev.q2 };
  }

  const check = {
    step1(companyId, tileId, selected) {
      const rel = relevantRisks(companyId, tileId);
      const sel = (selected || []).slice();
      if (rel.length === 0) {
        const ok = sel.length === 1 && sel[0] === 'none';
        return { ok: ok, relevant: rel, missing: [], extra: sel.filter((id) => id !== 'none'), noneCase: true };
      }
      const chosen = sel.includes('none') ? [] : sel;
      const missing = rel.filter((id) => !chosen.includes(id));
      const extra = chosen.filter((id) => !rel.includes(id));
      return { ok: missing.length === 0 && extra.length === 0, relevant: rel, missing: missing, extra: extra, noneCase: false };
    },
    step2(companyId, tileId, families) {
      const req = requiredFamilies(companyId, tileId);
      const sel = (families || []).slice();
      if (req.length === 1 && req[0] === 'none') {
        const irrelevant = sel.filter((id) => id !== 'none');
        return { ok: sel.includes('none') && irrelevant.length === 0, required: req, missing: sel.includes('none') ? [] : ['none'],
          irrelevant: irrelevant, apPenalty: irrelevant.length * R.irrelevantFamilyApCost, noneOk: sel.includes('none'), noneWrong: false, showDbLimits: sel.includes('climate') };
      }
      const noneWrong = sel.includes('none');
      const missing = req.filter((id) => !sel.includes(id));
      const irrelevant = sel.filter((id) => id !== 'none' && !req.includes(id));
      return { ok: !noneWrong && missing.length === 0 && irrelevant.length === 0, required: req, missing: missing, irrelevant: irrelevant,
        apPenalty: irrelevant.length * R.irrelevantFamilyApCost, noneOk: false, noneWrong: noneWrong, showDbLimits: sel.includes('climate') };
    },
    step3(scenarioIds, families) {
      const cov = coverage(scenarioIds);
      const fams = (families || []).filter((id) => id !== 'none');
      if (fams.length === 0) return { ok: true, coverage: cov, reason: 'notNeeded' };
      const ok = cov.high && cov.netzero;
      let reason = 'ok';
      if (!ok) reason = (cov.reference && !cov.high && !cov.netzero) ? 'reference' : 'sameSide';
      return { ok: ok, coverage: cov, reason: reason };
    },
    step4(companyId, depth, ap) {
      const order = R.depthOrder;
      const correct = correctDepth(companyId, ap);
      const diff = order.indexOf(depth) - order.indexOf(correct);
      const co = company(companyId);
      const overCost = diff > 0 ? round(diff * R.overAnalysisCostFrac * co.budget, 2) : 0;
      let reasonKey = 'step4Qualitative';
      if (correct === 'full') reasonKey = 'step4Full';
      else if (correct === 'simplified') reasonKey = co.exposure === 'high' ? 'step4SimplifyFirst' : 'step4Simplified';
      return { ok: diff === 0, correct: correct, diff: diff, overCost: overCost, affordable: R.depths[depth] ? R.depths[depth].cost <= ap : false, reasonKey: reasonKey };
    },
    step5(predictions, truths) {
      let n = 0, m = 0;
      Object.keys(truths || {}).forEach((rid) => {
        ['q1', 'q2'].forEach((q) => {
          m++;
          if (predictions && predictions[rid] && predictions[rid][q] === truths[rid][q]) n++;
        });
      });
      return { ok: m > 0 && n === m, correct: n, total: m };
    },
    step6(companyId, tileId, erm) {
      const rel = relevantRisks(companyId, tileId);
      const kris = (erm && erm.kris) || [];
      const owner = erm && erm.owner;
      if (!owner) return { ok: false, reason: 'noOwner' };
      if (rel.length === 0) return { ok: kris.includes('kriReview'), reason: kris.includes('kriReview') ? 'ok' : 'noKri' };
      const hit = D.erm.kris.some((k) => kris.includes(k.id) && k.risks.some((r) => rel.includes(r)));
      return { ok: hit, reason: hit ? 'ok' : 'noKri' };
    }
  };

  /* 這個風險在這回合能看到多細：hidden（沒辨識）／noData（沒下載對的資料）／qualitative／simplified／full */
  function forecastLevel(turnRecord, riskId) {
    if (!turnRecord || !(turnRecord.risks || []).includes(riskId)) return 'hidden';
    const fams = (RISKS[riskId] || {}).families || [];
    if (!fams.some((f) => (turnRecord.families || []).includes(f))) return 'noData';
    return turnRecord.depth || 'qualitative';
  }

  function band(metric, value, companyId) {
    const v = Math.abs(value);
    const table = metric === 'capacity' ? R.bands.capacity : R.bands.cfFrac;
    const x = metric === 'capacity' ? v : v / company(companyId).revenue;
    for (const [lim, name] of table) if (x < lim) return name;
    return table[table.length - 1][1];
  }

  function fmtYi(n) {
    const v = round(n, 2);
    const s = Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2);
    return s.replace(/\.?0+$/, '') + ' 億元';
  }
  function fmtPct(n) { return round(n, 1) + '%'; }

  /* 結局整理表：每列 { risk, kind, data, impact, measures, conclusion, flags[] } */
  function summaryRows(state, actual) {
    const co = company(state.companyId);
    const rel = relevantRisks(state.companyId, state.tileId);
    const allEvents = actual.turns.flatMap((t) => t.events.map((e) => Object.assign({ turnIndex: t.turnIndex }, e)));
    const hitRisks = uniq(allEvents.filter((e) => e.kind !== 'opportunity' && e.risk && e.value !== 0).map((e) => e.risk));
    const riskIds = D.risks.map((r) => r.id).filter((id) => rel.includes(id) || hitRisks.includes(id));
    const scenarioNames = uniq(state.turns.flatMap((t) => t.scenarios || []));
    const rows = [];
    if (riskIds.length === 0) {
      rows.push({ risk: '無可合理預期的氣候風險', kind: '—', data: '查過 SASB 主題，判斷不需下載情境資料', impact: '無',
        measures: '不需要', conclusion: '具韌性', flags: [] });
    }
    riskIds.forEach((rid) => {
      const r = RISKS[rid];
      const levels = state.turns.map((t) => forecastLevel(t, rid));
      const order = ['hidden', 'noData', 'qualitative', 'simplified', 'full'];
      const best = levels.reduce((a, b) => (order.indexOf(b) > order.indexOf(a) ? b : a), 'hidden');
      const famNames = uniq(state.turns.flatMap((t) => (t.families || []).filter((f) => r.families.includes(f)))).map((f) => FAMILIES[f].name);
      const data = famNames.length ? famNames.join('、') + (scenarioNames.length ? '；' + scenarioNames.join('、') : '') : '未下載相關資料';
      const evs = allEvents.filter((e) => e.risk === rid && e.kind !== 'opportunity');
      const worst = (metric) => evs.filter((e) => e.metric === metric).reduce((a, e) => (Math.abs(e.value) > Math.abs(a ? a.value : 0) ? e : a), null);
      const wc = worst('capacity'), wf = worst('cf');
      const turnName = (e) => D.turns[e.turnIndex].name;
      let impact;
      if (best === 'hidden') impact = '未辨識，沒有分析';
      else if (best === 'noData') impact = '有辨識，但沒下載對的資料，估不出來';
      else {
        const parts = [];
        if (wc) parts.push(best === 'full' ? turnName(wc) + '產能 −' + round(wc.value, 1) + ' 個百分點（調適前 −' + round(wc.raw, 1) + '）'
          : best === 'simplified' ? turnName(wc) + '產能影響「' + band('capacity', wc.raw, co.id) + '」' : '產能會下降');
        if (wf) parts.push(best === 'full' ? turnName(wf) + '每年 ' + (wf.value < 0 ? '−' : '+') + fmtYi(Math.abs(wf.value)) + '（調適前 ' + (wf.raw < 0 ? '−' : '+') + fmtYi(Math.abs(wf.raw)) + '）'
          : best === 'simplified' ? turnName(wf) + '現金流影響「' + band('cf', wf.raw, co.id) + '」' : '現金流會受影響');
        if (!parts.length) parts.push('這條路線上影響很小');
        impact = parts.join('；');
      }
      const usedMeasures = uniq(evs.flatMap((e) => e.mitigatedBy)).map((id) => MEASURES[id].name);
      const residual = Math.max(wc ? band('capacity', wc.value, co.id) === '輕微' ? 0 : 1 : 0, wf ? band('cf', wf.value, co.id) === '輕微' ? 0 : 1 : 0);
      const flags = [];
      if (rid === 'flood' && co.id === 'X') flags.push('demo');
      if (rid === 'carbonfee') flags.push(evs.some((e) => e.src === 'demo') ? 'demo' : 'assumed');
      rows.push({ risk: r.name, kind: r.kind === 'physical' ? '實體' : '轉型', data: data, impact: impact,
        measures: usedMeasures.length ? usedMeasures.join('、') : '沒有採取措施',
        conclusion: evs.length === 0 ? '這條路線上沒有發生' : residual ? '仍需補強' : '已控制', flags: flags });
    });
    const opps = uniq(allEvents.filter((e) => e.kind === 'opportunity').map((e) => e.id));
    opps.forEach((id) => {
      const evs = allEvents.filter((e) => e.id === id);
      const got = evs.filter((e) => !e.missed && e.value > 0);
      const missed = evs.filter((e) => e.missed);
      const best = (list, key) => list.reduce((a, e) => Math.max(a, e[key]), 0);
      const ev = EVENTS[id];
      rows.push({ risk: ev.title, kind: '機會', data: '—',
        impact: got.length ? '每年最多 +' + fmtYi(best(got, 'value')) : '錯過：每年最多 +' + fmtYi(best(missed, 'raw')),
        measures: ev.requires ? ev.requires.map((m) => MEASURES[m].name).join(' 或 ') : '本業自然受惠',
        conclusion: got.length ? '已把握' : '錯過機會', flags: [] });
    });
    return rows;
  }

  function learningRecord(state) {
    const steps = D.text.sixSteps;
    return steps.map((name, i) => {
      const key = 'step' + (i + 1);
      let ok = 0, total = 0;
      state.turns.forEach((t) => {
        const c = t.checks && t.checks[key];
        if (!c) return;
        if (key === 'step5') { ok += c.correct; total += c.total; } else { total++; if (c.ok) ok++; }
      });
      return { step: name, ok: ok, total: total };
    });
  }

  function blankTurn() {
    return { risks: [], families: [], scenarios: [], depth: null, predictions: {}, truths: {}, bought: [],
      erm: { owner: null, kris: [] }, checks: {}, apPenalty: 0, overCost: 0, outcome: null };
  }

  /* 開新局。routeId 不給就隨機暗抽（rng 預設 Math.random）。 */
  function newGame(o) {
    const co = company(o.companyId);
    const rng = o.rng || Math.random;
    const routeId = o.routeId || (rng() < 0.5 ? 'high' : 'netzero');
    return { version: 1, companyId: co.id, tileId: o.tileId, routeId: routeId,
      turnIndex: 0, stepIndex: 0, budget: co.budget, spent: 0,
      turns: D.turns.map(blankTurn) };
  }

  /* 結算目前回合（實際路線）：回傳要存進 turns[t].outcome 的東西 */
  function settleTurn(state) {
    const t = state.turnIndex;
    const bought = state.turns.map((x) => (x.bought || []).slice());
    return project({ companyId: state.companyId, tileId: state.tileId, routeId: state.routeId, turnIndex: t, measureIds: activeMeasures(bought, t) });
  }

  function boughtByTurn(state) { return state.turns.map((x) => (x.bought || []).slice()); }

  CG.core = {
    data: D, ROUTE_IDS: ROUTE_IDS,
    company, measure, event, risk, family, scenario, route, tile, tiles, terrainOf, otherRoute,
    relevantRisks, requiredFamilies, apAvailable, ermCountBefore, correctDepth, coverage,
    measuresFor, measureCost, measureOpex, activeMeasures, emissionFactor, carbonPrice,
    resolve, meters, project, evaluate, assess, verdict, check, forecastLevel, band,
    summaryRows, learningRecord, newGame, settleTurn, boughtByTurn,
    fmtYi, fmtPct, round
  };
})();
/* ==== END:CORE ==== */
</script>

<script>
/* ==== REGION:STUBS ==== 擁有者：總指揮。最陽春的預設畫面，讓每個任務可以單獨測試；T1–T4 的區塊會覆蓋這些函式。 */
(function () {
  'use strict';
  const ui = CG.ui = CG.ui || {};
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  ui.esc = esc;
  ui.srcTag = (src) => src === 'demo' ? '<span class="tag-demo">' + esc(GAME_DATA.text.demoLabel) + '</span>'
    : src === 'assumed' ? '<span class="tag-assumed">' + esc(GAME_DATA.text.assumedLabel) + '</span>' : '';
  /* T2 */
  ui.renderCompanyPicker = function (el, ctx, onPick) {
    el.innerHTML = GAME_DATA.companies.map((c) => '<button type="button" data-id="' + c.id + '">' + esc(c.name) + '</button>').join(' ');
    el.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => onPick(b.dataset.id)));
  };
  ui.renderMap = function (el, ctx, onPick) {
    el.innerHTML = CG.core.tiles().map((t) => '<button type="button" data-id="' + t.id + '">' + esc(GAME_DATA.terrains[t.terrain].name) + '</button>').join(' ');
    el.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => onPick(b.dataset.id)));
  };
  /* T3 */
  ui.advisorTurnStart = function (state) {
    const line = GAME_DATA.advisor.turnStart[state.companyId][state.turnIndex];
    const terr = CG.core.terrainOf(state.tileId);
    return { text: line.text.replace('{site}', terr ? terr.name : ''), src: line.src || null };
  };
  ui.feedbackLines = function () { return []; };
  ui.renderAdvisor = function (el, line) { const p = document.createElement('p'); p.textContent = GAME_DATA.advisor.name + '：' + line.text; el.appendChild(p); };
  ui.renderEventCards = function (el, events) { el.innerHTML = '<pre>' + esc(JSON.stringify(events, null, 1)) + '</pre>'; };
  ui.renderDatabaseCards = function () {};
  ui.renderParameterCards = function () {};
  ui.renderForecast = function () {};
  /* T4 */
  ui.renderEnding = function (el, ctx, handlers) {
    el.innerHTML = '<pre>' + esc(JSON.stringify({ actual: ctx.actual.verdict, other: ctx.other.verdict }, null, 1)) + '</pre>';
  };
  /* T1 */
  CG.app = CG.app || {
    start(el) { el.innerHTML = '<p style="padding:16px">遊戲流程（T1）尚未完成。</p>'; },
    act() { throw new Error('CG.app.act 尚未實作（T1）'); },
    getState() { return null; }
  };
})();
/* ==== END:STUBS ==== */
</script>
