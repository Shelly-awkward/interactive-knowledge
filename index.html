<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互動知識庫｜中學生的互動式學習教材</title>
<style>
:root{
  --bg:#F4F6FA;
  --card:#FFFFFF;
  --ink:#1E2430;
  --ink-soft:#5A6478;
  --line:#DDE3EE;
  --accent:#FCA311;
  --night:#14213D;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.7;
}
header{
  background:linear-gradient(180deg,#0C1428 0%,var(--night) 100%);
  color:#fff;
  padding:44px 20px 32px;
}
.head-inner{max-width:960px;margin:0 auto;}
header .eyebrow{
  display:inline-block;color:var(--accent);font-weight:700;
  letter-spacing:.3em;font-size:.78rem;
  border:1px solid rgba(252,163,17,.5);
  padding:3px 12px 3px 15px;border-radius:999px;margin-bottom:14px;
}
header h1{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:900;letter-spacing:.06em;}
header p{margin-top:10px;color:#C7D0E4;font-size:.95rem;max-width:560px;}
main{max-width:960px;margin:0 auto;padding:24px 16px 80px;}
.toolbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  margin:6px 0 22px;
}
.toolbar input[type=search]{
  flex:1 1 220px;
  padding:10px 14px;border:1px solid var(--line);border-radius:999px;
  font:inherit;font-size:.92rem;background:var(--card);
}
.toolbar input[type=search]:focus{outline:2px solid var(--accent);border-color:transparent;}
.filters{display:flex;flex-wrap:wrap;gap:6px;}
.filters button{
  font:inherit;font-size:.82rem;font-weight:600;
  padding:6px 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
}
.filters button.on{background:var(--night);border-color:var(--night);color:#fff;}
.filterrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;}
.filterrow .flabel{
  flex:0 0 auto;min-width:2.8em;
  font-size:.75rem;font-weight:700;letter-spacing:.08em;color:var(--ink-soft);
}
.filters button .n{margin-left:6px;font-size:.78em;font-weight:500;opacity:.55;}
.filters button[disabled]{opacity:.35;cursor:default;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.lesson{
  display:flex;flex-direction:column;gap:8px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 18px 16px;text-decoration:none;color:inherit;
  transition:transform .15s,box-shadow .15s;
}
.lesson:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(20,33,61,.12);}
.lesson .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:.72rem;}
.lesson .meta span{
  background:#EAEEF6;color:var(--ink-soft);border-radius:999px;padding:2px 10px;
}
.lesson .meta span.subject{background:rgba(252,163,17,.18);color:#8A5A00;font-weight:700;}
.lesson h2{font-size:1.15rem;font-weight:800;letter-spacing:.03em;}
.lesson p{font-size:.88rem;color:var(--ink-soft);flex:1;}
.lesson .date{font-size:.72rem;color:#9AA3B8;}
.empty{color:var(--ink-soft);padding:30px 4px;font-size:.95rem;}
footer{
  max-width:960px;margin:0 auto;padding:0 16px 40px;
  font-size:.78rem;color:#9AA3B8;
}
.visits{margin-top:10px;}
.visits b{color:var(--accent);font-weight:700;}
@media (prefers-color-scheme: dark){
  :root{--bg:#0F1524;--card:#1A2338;--ink:#E8ECF6;--ink-soft:#9AA6C2;--line:#2A3550;}
  .filters button{background:var(--card);color:var(--ink-soft);}
  .lesson .meta span{background:#243050;color:#9AA6C2;}
  .lesson .meta span.subject{background:rgba(252,163,17,.2);color:var(--accent);}
}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <span class="eyebrow">INTERACTIVE&nbsp;KNOWLEDGE</span>
    <h1>互動知識庫</h1>
    <p>互動式學習教材。每份教材都是單一 HTML 檔，點開卡片就能開始。</p>
  </div>
</header>
<main>
  <div class="toolbar">
    <input id="q" type="search" placeholder="搜尋標題、關鍵字…" aria-label="搜尋教材">
    <div class="filterrow"><span class="flabel">科目</span><div class="filters" id="filters"></div></div>
    <div class="filterrow"><span class="flabel">年段</span><div class="filters" id="stageFilters"></div></div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>沒有符合的教材。</p>
</main>
<footer>
  <div class="visits" id="visits" hidden>
    本站總瀏覽 <b id="visits-pv"></b> 次 ・ 訪客 <b id="visits-uv"></b> 人
  </div>
</footer>
<script>
(function(){
  // 訪客計數：貼上專用計數端點的 Apps Script 網址（部署方式見 docs/訪客計數器設定.md）。
  // 這個網址只能「+1 並回傳次數」，可以公開；學習紀錄的上傳網址仍然不放進 repo。
  // 留空時不顯示計數。
  var COUNTER_URL = "https://script.google.com/macros/s/AKfycbxp4XR5CNu5X4laPwbPsi-aeCkEcIuAFT1AlRBYI5kfWQ8jaMj2lzBXAgx51WJI1PnLcA/exec";

  var box = document.getElementById("visits");
  var pvEl = document.getElementById("visits-pv");
  var uvEl = document.getElementById("visits-uv");

  if (COUNTER_URL) {
    var isNew = !localStorage.getItem("visited_v1");
    var sep = COUNTER_URL.indexOf("?") === -1 ? "?" : "&";
    fetch(COUNTER_URL + sep + "v=" + (isNew ? "1" : "0"))
      .then(function(r){ return r.json(); })
      .then(function(d){
        localStorage.setItem("visited_v1", "1");
        pvEl.textContent = d.pv;
        uvEl.textContent = d.uv;
        box.hidden = false;
      })
      .catch(function(){ /* 計數失敗就不顯示，不影響頁面 */ });
  }
})();
</script>
<script src="lessons/lessons.js"></script>
<script>
(function(){
  var lessons = (window.__LESSONS__ || []).slice();
  var grid = document.getElementById("grid");
  var empty = document.getElementById("empty");
  var q = document.getElementById("q");
  var subjectBox = document.getElementById("filters");
  var stageBox = document.getElementById("stageFilters");
  var activeSubject = "全部";
  var activeStage = "全部";

  // 年段固定這四段。教材沒指定 stage 時，從 level 字串推算；
  // 跨年段的（例如「國小～國中」）兩邊都算，按國小或按國中都找得到。
  var STAGES = ["國小", "國中", "高中", "成人・檢定"];
  function stagesOf(l){
    if (l.stage && l.stage.length) return l.stage;
    var t = l.level || "", out = [];
    if (t.indexOf("國小") !== -1) out.push("國小");
    if (t.indexOf("國中") !== -1) out.push("國中");
    if (t.indexOf("高中") !== -1) out.push("高中");
    return out.length ? out : ["成人・檢定"];
  }

  var subjects = ["全部"];
  lessons.forEach(function(l){
    if (l.subject && subjects.indexOf(l.subject) === -1) subjects.push(l.subject);
  });

  function hit(l, kw, subject, stage){
    if (subject !== "全部" && l.subject !== subject) return false;
    if (stage !== "全部" && stagesOf(l).indexOf(stage) === -1) return false;
    if (!kw) return true;
    var hay = [l.title, l.subtitle, l.subject, l.level].concat(l.tags || []).join(" ").toLowerCase();
    return hay.indexOf(kw) !== -1;
  }

  function countBy(kw, subject, stage){
    var n = 0;
    lessons.forEach(function(l){ if (hit(l, kw, subject, stage)) n++; });
    return n;
  }

  function buildRow(box, values, onPick){
    values.forEach(function(v){
      var b = document.createElement("button");
      b.setAttribute("data-v", v);
      b.appendChild(document.createTextNode(v));
      var n = document.createElement("span");
      n.className = "n";
      b.appendChild(n);
      b.addEventListener("click", function(){
        if (b.disabled) return;
        onPick(v);
        render();
      });
      box.appendChild(b);
    });
  }
  buildRow(subjectBox, subjects, function(v){ activeSubject = v; });
  buildRow(stageBox, ["全部"].concat(STAGES), function(v){ activeStage = v; });

  // 按鈕上的數字＝選了它會剩幾張；0 張就停用，避免按出空白頁
  function paintRow(box, active, countFor){
    Array.prototype.forEach.call(box.children, function(b){
      var v = b.getAttribute("data-v");
      var n = countFor(v);
      b.className = (v === active) ? "on" : "";
      b.querySelector(".n").textContent = n;
      b.disabled = (n === 0 && v !== active);
    });
  }

  function render(){
    var kw = q.value.trim().toLowerCase();
    grid.innerHTML = "";
    var shown = 0;
    lessons.forEach(function(l){
      if (!hit(l, kw, activeSubject, activeStage)) return;
      shown++;
      var a = document.createElement("a");
      a.className = "lesson";
      a.href = l.file;
      a.innerHTML =
        '<div class="meta"><span class="subject"></span><span class="level"></span></div>' +
        '<h2></h2><p></p><div class="date"></div>';
      a.querySelector(".subject").textContent = l.subject || "";
      a.querySelector(".level").textContent = l.level || "";
      a.querySelector("h2").textContent = l.title;
      a.querySelector("p").textContent = l.subtitle || "";
      a.querySelector(".date").textContent = l.added ? "加入於 " + l.added : "";
      grid.appendChild(a);
    });
    empty.hidden = shown > 0;
    paintRow(subjectBox, activeSubject, function(v){ return countBy(kw, v, activeStage); });
    paintRow(stageBox, activeStage, function(v){ return countBy(kw, activeSubject, v); });
  }

  q.addEventListener("input", render);
  render();
})();
</script>
</body>
</html>
